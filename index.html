<!doctype html>
<title>홍술 — 술을 해석하다</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    /* HONGSUL DS — luxury black & pink (dark-first) */
    --accent:#FF4F87; --accent-2:#E23370; --accent-soft:#2C1A22;
    --gold:#FF4F87; --gold-bright:#FF7FA8; --gold-deep:#E23370; --wine:#FF4F87;
    --page:#000000; --ground:#0E0B0D; --surface:#171216; --surface-2:#201A1F; --surface-3:#2B2229;
    --ink:#F4EDF1; --ink-2:#C2B5BC; --ink-soft:#8B7D85; --hair:#262026; --hair-gold:rgba(255,79,135,.28);
    --good:#4CC98A; --warn:#E3B15C; --bad:#F07178;
    --sh:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -20px rgba(0,0,0,.75);
    --r-s:10px; --r-m:16px; --r-l:22px; --nav-h:64px;
  }
  /* 홍술은 항상 블랙&핑크 — 시스템/뷰어 테마 무시하고 다크 고정 */
  :root[data-theme="light"], :root[data-theme="dark"]{--accent:#FF4F87;--accent-2:#E23370;--accent-soft:#2C1A22;--gold:#FF4F87;--gold-bright:#FF7FA8;--gold-deep:#E23370;--wine:#FF4F87;--page:#000000;--ground:#0E0B0D;--surface:#171216;--surface-2:#201A1F;--surface-3:#2B2229;--ink:#F4EDF1;--ink-2:#C2B5BC;--ink-soft:#8B7D85;--hair:#262026;--hair-gold:rgba(255,79,135,.28);--good:#4CC98A;--warn:#E3B15C;--bad:#F07178;--sh:0 1px 2px rgba(0,0,0,.5),0 14px 32px -20px rgba(0,0,0,.75);}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    background:var(--page); color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility; line-height:1.5;
  }
  .serif{font-family:inherit;}
  button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;}
  .card,.chip,.pref{touch-action:manipulation;}
  .aura{display:none;}
  .lockup{display:none;}

  .app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--ground);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}

  /* ===== top bar ===== */
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 92%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top)) 20px 10px;}
  .tb-row{display:flex;align-items:center;}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--accent);display:flex;align-items:center;}
  .logo .han{color:inherit;}
  .logomark{display:inline-grid;place-items:center;margin-right:7px;}
  .logomark svg{width:24px;height:24px;display:block;}
  .lg{stroke:var(--ink);}
  .lq{fill:var(--accent);}
  .lq2{stroke:var(--accent);}
  .smark .straw{animation:strawin .9s cubic-bezier(.25,.8,.25,1);}
  @keyframes strawin{from{opacity:0;transform:translate(-2px,2px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .smark .straw{animation:none;} }
  .smark svg{width:58px;height:58px;display:block;margin-bottom:2px;animation:sfade .7s ease;}
  .smark .moon{animation:moonrise 1.1s cubic-bezier(.25,.8,.25,1);}
  @keyframes moonrise{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .smark .moon{animation:none;} }
  .tb-actions{margin-left:auto;display:flex;gap:6px;}
  .icobtn{width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink-2);border-radius:50%;font-size:15px;}
  .icobtn:active{background:var(--surface-2);}
  .bellwrap{position:relative;}
  .bellwrap .bdg{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--ground);}
  .search{margin-top:10px;display:flex;align-items:center;gap:9px;background:var(--surface-2);
    border:0;border-radius:12px;padding:11px 14px;}
  .search input{border:0;background:transparent;color:var(--ink);font-size:16px;width:100%;outline:none;font-family:inherit;}
  .search input::placeholder{color:var(--ink-soft);}
  .search svg{flex:none;color:var(--ink-soft);}

  /* ===== screens ===== */
  .screen{display:none;position:relative;padding-bottom:calc(var(--nav-h) + 28px);animation:fade .2s ease;}
  .screen.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .eyebrow{font-size:10.5px;letter-spacing:1.8px;color:var(--accent);font-weight:700;}
  .sec-h{display:flex;align-items:center;justify-content:space-between;padding:26px 20px 12px;}
  .sec-h h2{margin:0;font-size:17.5px;font-weight:800;letter-spacing:-.3px;}
  .sec-h .more{font-size:12.5px;color:var(--ink-soft);font-weight:500;}

  /* ===== hero ===== */
  .hero{margin:18px 20px 0;border-radius:var(--r-l);padding:24px 22px;position:relative;overflow:hidden;box-shadow:var(--sh);}
  .hero .eyebrow{color:#FF9DBF;position:relative;}
  .hero h1{margin:8px 0 4px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.5px;text-wrap:balance;position:relative;color:#fff;}
  .hero .hp{margin:0;font-size:12.5px;color:rgba(255,255,255,.75);position:relative;}
  .hero .cta{margin-top:18px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1B171C;
    border:0;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;position:relative;transition:transform .1s ease-out;}
  .hero .cta:active{transform:scale(.96);}

  /* ===== category rail ===== */
  .rail{display:flex;gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 20px 6px;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .catcard{flex:none;width:64px;text-align:center;background:none;border:0;padding:0;}
  .catcard .ic{width:58px;height:58px;margin:0 auto 7px;border-radius:50%;padding:0;background:none;border:0;
    transition:transform .12s ease-out;display:block;}
  .catcard:active .ic{transform:scale(.92);}
  .catcard .icp{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
    background-color:var(--surface-2);background-size:cover;background-position:center;
    border:1px solid var(--hair-gold);overflow:hidden;}
  .catcard .icp .mono{font-size:17px;}
  .catcard .nm{font-size:11.5px;color:var(--ink-2);font-weight:600;}

  /* ===== banners ===== */
  .banners{position:relative;margin:14px 20px 0;border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sh);
    touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;}
  .banners:active{cursor:grabbing;}
  .banner-track{display:flex;transition:transform .5s cubic-bezier(.25,.8,.25,1);will-change:transform;}
  .banner{flex:none;width:100%;padding:18px 20px 20px;color:#fff;min-height:100px;position:relative;overflow:hidden;}
  .banner .bk{font-size:10px;letter-spacing:1.4px;font-weight:700;color:rgba(255,255,255,.75);}
  .banner .bt{font-size:16.5px;font-weight:800;margin:5px 0 3px;line-height:1.3;letter-spacing:-.3px;text-wrap:balance;}
  .banner .bs{font-size:11.5px;color:rgba(255,255,255,.65);}
  .banner-dots{position:absolute;right:12px;bottom:11px;display:flex;gap:4px;}
  .banner-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);transition:.2s;}
  .banner-dots i.on{background:#fff;width:13px;border-radius:3px;}
  .banners.big{margin:12px 20px 0;border-radius:18px;}
  .banner.bimgb{min-height:210px;background-size:cover;background-position:center;
    display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px;}
  .bimgb .bt{font-size:20px;letter-spacing:-.4px;text-shadow:0 1px 8px rgba(0,0,0,.35);}
  .bimgb .bs{font-size:12px;color:rgba(255,255,255,.8);}
  .ad-tag2{position:absolute;top:12px;left:12px;font-size:9px;font-weight:800;letter-spacing:.6px;
    color:#fff;background:rgba(8,4,8,.45);backdrop-filter:blur(4px);padding:3px 7px;border-radius:5px;}
  .banner-count{position:absolute;right:12px;bottom:12px;background:rgba(8,4,8,.5);color:#fff;
    font-size:10px;padding:3px 9px;border-radius:10px;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  @media (max-width:380px){ .banner.bimgb{min-height:180px;} .bimgb .bt{font-size:18px;} }

  /* ===== reco card ===== */
  .reco-card{display:flex;align-items:center;gap:12px;margin:14px 20px 0;width:calc(100% - 40px);
    background:var(--accent-soft);border:0;border-radius:var(--r-m);padding:16px 18px;text-align:left;transition:transform .1s ease-out;}
  .reco-card:active{transform:scale(.985);}
  .reco-card .reco-txt{flex:1;}
  .reco-card .rt{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.35;margin:5px 0 3px;white-space:pre-line;letter-spacing:-.2px;}
  .reco-card .rs{font-size:11.5px;color:var(--ink-soft);}
  .reco-card .reco-go{flex:none;background:var(--accent);color:#fff;border-radius:11px;padding:9px 14px;font-size:12.5px;font-weight:700;}

  /* ===== BEST shelf ===== */
  .shelf{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 10px;scrollbar-width:none;}
  .shelf::-webkit-scrollbar{display:none;}
  .ptile{flex:none;width:116px;text-align:left;background:none;border:0;padding:0;transition:transform .1s ease-out;}
  .ptile:active{transform:scale(.96);}
  .pimg{position:relative;width:116px;height:116px;border-radius:14px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;}
  .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .pimg .mono{font-size:24px;}
  .pimg:has(img) .mono{display:none;}
  .prank{position:absolute;left:0;top:0;min-width:24px;height:24px;padding:0 6px;z-index:1;background:var(--accent);
    color:#fff;font-weight:800;display:grid;place-items:center;font-size:12px;border-radius:14px 0 10px 0;font-variant-numeric:tabular-nums;}
  .pname{font-size:12.5px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);}
  .pprice{font-size:13.5px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
  .pstar{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

  /* ===== list cards ===== */
  .list{padding:4px 20px 4px;display:flex;flex-direction:column;gap:10px;}
  .list .card{animation:fade .25s cubic-bezier(.2,.7,.2,1) both;}
  .list .card:nth-child(1){animation-delay:.02s}.list .card:nth-child(2){animation-delay:.05s}
  .list .card:nth-child(3){animation-delay:.08s}.list .card:nth-child(4){animation-delay:.11s}
  .list .card:nth-child(n+5){animation-delay:.13s}
  .card{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--hair);
    border-radius:var(--r-m);padding:13px 14px;transition:transform .09s ease-out;text-align:left;width:100%;
    content-visibility:auto;contain-intrinsic-size:auto 96px;cursor:pointer;}
  .card:active{transform:scale(.985);}
  .rank{flex:none;width:22px;text-align:center;font-size:16px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .rank.top{color:var(--accent);font-weight:800;}
  .bottle{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);
    position:relative;overflow:hidden;}
  .bottle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .mono{font-size:20px;font-weight:700;color:var(--ink-soft);}
  .bottle:has(img) .mono{display:none;}
  .info{flex:1;min-width:0;}
  .info .cat{font-size:10.5px;color:var(--ink-soft);letter-spacing:.2px;}
  .info .name{font-size:15px;font-weight:700;margin:2px 0 0;letter-spacing:-.2px;}
  .crow{display:flex;align-items:baseline;gap:7px;margin:3px 0 7px;}
  .crow b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
  .crow span{font-size:11px;color:var(--ink-soft);}
  .star{color:#E3B15C;}
  .metrics{display:flex;gap:5px;flex-wrap:wrap;}
  .pill{font-size:10.5px;padding:3.5px 8px;border-radius:6px;background:var(--surface-2);border:0;
    color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600;}
  .pill.g-good{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good);}
  .pill.g-warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn);}
  .pill.g-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);}
  .bdg-best{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.6px;color:var(--accent);
    background:var(--accent-soft);border-radius:4px;padding:2px 5px;margin-right:5px;vertical-align:2px;}
  .savebtn{align-self:center;margin-left:auto;background:none;border:0;font-size:19px;color:var(--ink-soft);padding:6px;transition:.15s;}
  .savebtn.on{color:var(--accent);}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:48px 20px;line-height:1.7;}

  /* ===== rank tabs ===== */
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:14px 20px 6px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);
    padding:8px 14px;border-radius:20px;font-size:12.5px;white-space:nowrap;transition:.15s;font-weight:600;}
  .chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink);}

  /* ===== match ===== */
  .match-hd{padding:22px 20px 6px;}
  .match-hd h2{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.4px;}
  .match-hd p{margin:0;font-size:13px;color:var(--ink-soft);}
  .radar-wrap{padding:8px 20px 4px;}
  .radar-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-l);padding:16px 12px;box-shadow:var(--sh);}
  .radar-card canvas{width:100%;height:auto;display:block;}
  .prefs{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px 4px;}
  .pref{border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);padding:9px 14px;
    border-radius:20px;font-size:12.5px;transition:.15s;font-weight:600;}
  .pref.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;}

  /* ===== my ===== */
  .profile-card{margin:16px 20px 4px;border-radius:var(--r-l);padding:22px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--sh);position:relative;overflow:hidden;}
  .profile-card .k{font-size:10px;letter-spacing:1.8px;color:rgba(255,255,255,.8);font-weight:700;}
  .profile-card h3{margin:8px 0 4px;font-size:23px;font-weight:800;letter-spacing:-.3px;}
  .profile-card .pd{margin:0;font-size:13px;color:rgba(255,255,255,.85);}
  .pstats{display:flex;gap:24px;margin-top:18px;}
  .pstat b{font-size:21px;font-variant-numeric:tabular-nums;}
  .pstat span{display:block;font-size:10px;color:rgba(255,255,255,.75);letter-spacing:.5px;margin-top:1px;}

  /* ===== detail sheet ===== */
  .scrim{position:fixed;inset:0;background:rgba(12,8,12,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:440px;max-height:94vh;max-height:92dvh;overflow-y:auto;
    overscroll-behavior:contain;background:var(--ground);border-radius:22px 22px 0 0;z-index:50;
    transform:translate(-50%,100%);transition:transform .28s cubic-bezier(.22,.9,.3,1);will-change:transform;}
  .sheet.open{transform:translate(-50%,0);}
  .grab{width:40px;height:4px;background:var(--hair);border-radius:3px;margin:10px auto 0;}
  .d-hero{padding:18px 20px 16px;display:flex;gap:14px;align-items:center;}
  .d-bottle{flex:none;width:80px;height:80px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2);
    position:relative;overflow:hidden;}
  .d-bottle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .d-bottle .mono{font-size:30px;}
  .d-bottle:has(img) .mono{display:none;}
  .d-title .cat{font-size:11px;color:var(--ink-soft);}
  .d-title .name{font-size:21px;font-weight:800;margin:3px 0 6px;letter-spacing:-.4px;}
  .d-rating b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800;}
  .d-rating .star{font-size:13px;}
  .d-rating .cnt{color:var(--ink-soft);font-size:12px;}
  .d-meta{display:flex;gap:10px;padding:0 20px 4px;}
  .d-meta .m{flex:1;background:var(--surface-2);border:0;border-radius:12px;padding:12px 8px;text-align:center;}
  .d-meta .m b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;font-weight:800;}
  .d-meta .m span{font-size:10px;color:var(--ink-soft);margin-top:2px;display:block;}

  .block{margin:12px 20px 0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-m);padding:16px;}
  .block h4{margin:0 0 13px;font-size:13.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .desc{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin:0;}

  .bars{display:flex;flex-direction:column;gap:11px;}
  .bar-row{display:grid;grid-template-columns:54px 1fr 32px;align-items:center;gap:11px;font-size:12px;}
  .bar-row .lbl{color:var(--ink-soft);}
  .track{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .fill{height:100%;border-radius:6px;background:var(--accent);transition:width .4s cubic-bezier(.25,.8,.25,1);}
  .bar-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft);}

  .ingr{display:flex;flex-direction:column;gap:11px;}
  .ing{display:flex;align-items:center;gap:11px;font-size:13.5px;}
  .ing .badge{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;}
  .b-good{background:var(--good);}.b-warn{background:var(--warn);}.b-bad{background:var(--bad);}
  .ing .nm{flex:1;}
  .ing .role{font-size:11px;color:var(--ink-soft);}
  .legend{display:flex;gap:14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--hair);font-size:10.5px;color:var(--ink-soft);}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}

  .pairs{display:flex;gap:8px;flex-wrap:wrap;}
  .pair{background:var(--surface-2);border:0;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;}
  .pair .emo{margin-right:5px;}

  .review{border-top:1px solid var(--hair);padding-top:13px;margin-top:13px;font-size:13.5px;color:var(--ink-2);line-height:1.65;}
  .review:first-of-type{border-top:0;padding-top:0;margin-top:0;}
  .review .who{color:var(--ink-soft);font-size:11px;margin-bottom:4px;}
  .review .who .s{color:var(--ink);font-weight:700;}

  .sim{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none;}
  .sim::-webkit-scrollbar{display:none;}
  .simcard{flex:none;width:88px;text-align:center;background:none;border:0;padding:0;}
  .simb{width:60px;height:60px;border-radius:14px;margin:0 auto 7px;display:grid;place-items:center;background:var(--surface-2);
    position:relative;overflow:hidden;}
  .simb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .simb .mono{font-size:22px;}
  .simb:has(img) .mono{display:none;}
  .simcard .n{font-size:11.5px;font-weight:600;line-height:1.35;}
  .simcard .r{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

  .d-actions{display:flex;gap:10px;padding:16px 20px calc(24px + env(safe-area-inset-bottom));position:sticky;bottom:0;
    background:linear-gradient(to top,var(--ground) 75%,transparent);}
  .btn-save{flex:none;width:52px;border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);border-radius:13px;font-size:19px;}
  .btn-save.on{color:var(--accent);border-color:var(--accent);}
  .btn-primary{flex:1;border:0;background:var(--accent);color:#fff;border-radius:13px;font-size:14.5px;font-weight:700;
    transition:transform .1s ease-out;}
  .btn-primary:active{transform:scale(.97);background:var(--accent-2);}

  /* ===== nav ===== */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;height:var(--nav-h);
    background:color-mix(in srgb,var(--ground) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--hair);display:flex;z-index:35;padding-bottom:env(safe-area-inset-bottom);}
  .nav button{flex:1;border:0;background:none;color:var(--ink-soft);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;font-size:10px;padding-top:4px;transition:color .15s;position:relative;}
  .nav button.on{color:var(--ink);font-weight:700;}
  .nav button.on svg{color:var(--accent);}
  .nav svg{width:20px;height:20px;}
  .nav button{font-size:9.5px;letter-spacing:-.2px;}
  @media (max-width:380px){ .nav svg{width:18px;height:18px;} .nav button{font-size:9px;} }
  .nav .fab{gap:2px;overflow:visible;}
  .fabc{width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center;
    margin-top:-24px;border:4px solid var(--ground);
    box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 65%,transparent);
    transition:transform .12s ease-out, background .15s;}
  .fabc svg{color:#fff;width:23px;height:23px;}
  .nav .fab:active .fabc{transform:scale(.92);}
  .nav .fab.on .fabc{background:var(--accent-2);}
  .nav .fab.on{color:var(--accent);}

  /* ===== onboarding ===== */
  .onb{position:fixed;inset:0;z-index:60;max-width:440px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;background:var(--ground);}
  .onb.hide{display:none;}
  .onb-top{padding:24px 24px 0;}
  .onb-prog{height:3px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .onb-prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
  .onb-skip{position:absolute;top:22px;right:22px;background:none;border:0;color:var(--ink-soft);font-size:12.5px;}
  .onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;}
  .onb-body .eyebrow{margin-bottom:12px;}
  .onb-body h2{margin:0 0 8px;font-size:25px;line-height:1.3;font-weight:800;letter-spacing:-.4px;text-wrap:balance;}
  .onb-body .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:26px;}
  .onb-opts{display:flex;flex-direction:column;gap:10px;}
  .onb-opt{border:1.5px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:14px;
    padding:16px 18px;font-size:15px;font-weight:600;text-align:left;display:flex;align-items:center;gap:13px;transition:.15s;}
  .onb-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
  .onb-foot{padding:18px 24px calc(24px + env(safe-area-inset-bottom));}
  .onb-next{width:100%;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:16px;
    font-size:15px;font-weight:700;transition:transform .1s ease-out,opacity .15s;}
  .onb-next:active:not(:disabled){transform:scale(.98);background:var(--accent-2);}
  .onb-next:disabled{opacity:.35;}
  .onb-next.ghost{background:var(--accent-soft);color:var(--accent);}

  /* ===== gate / splash ===== */
  .gate{position:fixed;inset:0;z-index:90;max-width:440px;left:50%;transform:translateX(-50%);
    background:rgba(12,8,12,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:26px;}
  .gate.hide{display:none;}
  .gate-card{background:var(--ground);border-radius:20px;padding:28px 24px;width:100%;text-align:center;box-shadow:var(--sh);}
  .gate-card .g19{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-size:19px;font-weight:800;margin:0 auto 14px;}
  .gate-card h3{margin:0 0 6px;font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .gate-card p{margin:0 0 20px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .gate-card .g-no{width:100%;border:0;background:transparent;color:var(--ink-soft);border-radius:13px;padding:12px;font-size:13.5px;}

  .splash{position:fixed;inset:0;z-index:100;max-width:440px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:var(--ground);transition:opacity .4s ease;}
  .splash.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s;}
  .splash .slogo{font-size:42px;font-weight:800;letter-spacing:-1px;color:var(--accent);animation:sfade .8s ease;}
  .splash .slogo .han{color:inherit;}
  .splash .stag{font-size:11px;letter-spacing:3.5px;color:var(--ink-soft);font-weight:600;animation:sfade 1.1s ease;}
  .splash .sbar{width:110px;height:2.5px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:12px;}
  .splash .sbar i{display:block;height:100%;width:40%;background:var(--accent);animation:sload 1.1s ease infinite;}
  @keyframes sfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes sload{0%{transform:translateX(-120%);}100%{transform:translateX(320%);}}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:70;
    background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
    opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--sh);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ===== skeleton ===== */
  .sk{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-m);padding:13px 14px;}
  .sk .ska{width:56px;height:56px;border-radius:14px;flex:none;}
  .sk .skb{flex:1;display:flex;flex-direction:column;gap:8px;}
  .sk .skl{height:10px;border-radius:6px;width:38%;}
  .sk .skl2{height:14px;border-radius:6px;width:68%;}
  .shimmer{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
    background-size:200% 100%;animation:shim 1.3s linear infinite;}
  @keyframes shim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* ===== top ad bar ===== */
  .adbar{position:relative;overflow:hidden;padding-top:env(safe-area-inset-top);background:var(--surface-2);}
  .ad-track{display:flex;transition:transform .45s cubic-bezier(.25,.8,.25,1);will-change:transform;}
  .ad-slide{flex:none;width:100%;display:flex;align-items:center;gap:9px;padding:12px 64px 12px 20px;border:0;
    text-align:left;font-size:12.5px;color:var(--ink-2);line-height:1.4;}
  .ad-slide b{color:var(--ink);font-weight:800;}
  .ad-tag{flex:none;font-size:9px;font-weight:800;letter-spacing:.5px;color:var(--ink-soft);
    border:1px solid var(--hair);padding:2px 5px;border-radius:4px;background:var(--ground);}
  .ad-slide.ad-a{background:var(--accent-soft);}
  .ad-slide.ad-b{background:color-mix(in srgb,#4b79e8 11%,var(--surface-2));}
  .ad-slide.ad-c{background:color-mix(in srgb,#e8a34c 13%,var(--surface-2));}
  .ad-count{position:absolute;right:36px;top:50%;transform:translateY(calc(-50% + env(safe-area-inset-top)/2));
    font-size:9.5px;color:var(--ink-soft);background:color-mix(in srgb,var(--ground) 80%,transparent);
    border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums;}
  .ad-x{position:absolute;right:6px;top:50%;transform:translateY(calc(-50% + env(safe-area-inset-top)/2));
    border:0;background:none;color:var(--ink-soft);font-size:13px;padding:8px;z-index:2;}
  @media (max-width:380px){ .ad-slide{padding-left:16px;} }

  /* ===== community ===== */
  .composer{display:flex;gap:9px;margin:14px 20px 4px;}
  .composer input{flex:1;border:0;background:var(--surface-2);border-radius:12px;padding:12px 14px;
    color:var(--ink);font-size:16px;outline:none;font-family:inherit;}
  .composer input::placeholder{color:var(--ink-soft);}
  .composer button{flex:none;border:0;background:var(--accent);color:#fff;border-radius:12px;
    padding:0 16px;font-size:13.5px;font-weight:700;transition:transform .1s ease-out;}
  .composer button:active{transform:scale(.95);}
  .post{margin:10px 20px 0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-m);padding:15px 16px;}
  .phead{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .pav{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-size:14px;font-weight:800;}
  .pwho{font-size:13px;font-weight:700;}
  .ptime{font-size:10.5px;color:var(--ink-soft);margin-left:auto;}
  .ptext{font-size:13.5px;color:var(--ink-2);line-height:1.65;white-space:pre-line;}
  .pdrink{display:inline-flex;align-items:center;gap:5px;margin-top:10px;background:var(--surface-2);
    border:0;border-radius:9px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);}
  .pdrink b{color:var(--accent);font-weight:800;}
  .pacts{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--hair);}
  .pact{border:0;background:none;color:var(--ink-soft);font-size:12px;font-weight:600;padding:5px 9px;
    border-radius:9px;display:inline-flex;align-items:center;gap:5px;transition:.15s;}
  .pact:active{background:var(--surface-2);}
  .pact.liked{color:var(--accent);}
  .cmts{margin-top:11px;padding-top:11px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:9px;}
  .cmt{display:flex;gap:8px;font-size:12.5px;line-height:1.55;}
  .cmt b{flex:none;color:var(--ink);font-weight:700;}
  .cmt span{color:var(--ink-2);}
  .cmt-row{display:flex;gap:7px;margin-top:10px;}
  .cmt-row input{flex:1;border:0;background:var(--surface-2);border-radius:10px;padding:9px 12px;
    color:var(--ink);font-size:16px;outline:none;font-family:inherit;}
  .cmt-row button{flex:none;border:0;background:var(--surface-3);color:var(--ink);border-radius:10px;
    padding:0 13px;font-size:12.5px;font-weight:700;}
  @media (max-width:380px){ .composer,.post,.cwrap{margin-left:16px;margin-right:16px;} }
  .cwrap{margin:10px 20px 4px;}
  /* ===== media ===== */
  .pmedia{margin-top:11px;border-radius:13px;overflow:hidden;background:var(--surface-2);position:relative;}
  .pmedia img,.pmedia video{width:100%;display:block;max-height:340px;object-fit:cover;background:#000;}
  .pmedia video{max-height:400px;}
  .pmedia.multi{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:transparent;}
  .pmedia.multi img,.pmedia.multi video{height:130px;border-radius:9px;}
  .vbadge{position:absolute;left:9px;top:9px;background:rgba(8,4,8,.6);color:#fff;font-size:9.5px;
    font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:5px;z-index:1;pointer-events:none;}
  .mprev{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .mprev .mp{position:relative;width:62px;height:62px;border-radius:10px;overflow:hidden;background:var(--surface-2);}
  .mprev .mp img,.mprev .mp video{width:100%;height:100%;object-fit:cover;}
  .mprev .mp button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;border:0;
    background:rgba(8,4,8,.72);color:#fff;font-size:10px;display:grid;place-items:center;padding:0;}
  .tchip.media{color:var(--accent);}
  .mhint{font-size:10.5px;color:var(--ink-soft);margin-top:6px;}

  /* ===== my page / settings ===== */
  .menu{margin:12px 20px 0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-m);overflow:hidden;}
  .menu .mtitle{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--ink-soft);padding:13px 16px 7px;}
  .mrow{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:14px 16px;
    text-align:left;font-size:14px;color:var(--ink);border-top:1px solid var(--hair);transition:background .12s;}
  .mrow:first-of-type{border-top:0;}
  .mrow:active{background:var(--surface-2);}
  .mrow .mi{flex:none;width:26px;display:grid;place-items:center;color:var(--accent);}
  .mrow .mi svg{width:18px;height:18px;}
  .mrow .mlabel{flex:1;font-weight:600;}
  .mrow .mval{font-size:12.5px;color:var(--ink-soft);font-weight:500;}
  .mrow .marrow{color:var(--ink-soft);font-size:15px;}
  .mrow.danger .mlabel{color:var(--bad);} .mrow.danger .mi{color:var(--bad);}
  .sw{flex:none;width:44px;height:26px;border-radius:14px;background:var(--surface-3);position:relative;transition:.2s;}
  .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-soft);transition:.2s;}
  .sw.on{background:var(--accent);} .sw.on i{left:21px;background:#fff;}
  .stats-row{display:flex;gap:9px;margin:12px 20px 0;}
  .stat-box{flex:1;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px 10px;text-align:center;}
  .stat-box b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat-box span{font-size:10.5px;color:var(--ink-soft);margin-top:2px;display:block;}
  .lvl{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:20px;
    padding:3px 10px;font-size:10.5px;font-weight:700;margin-top:8px;}
  /* modal sheet reuse */
  .msheet-h{padding:18px 20px 10px;}
  .msheet-h h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.4px;}
  .msheet-h p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .fbox{padding:0 20px;}
  .ta{width:100%;border:1.5px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:13px;
    padding:14px;font-size:15px;font-family:inherit;outline:none;resize:vertical;min-height:120px;line-height:1.6;}
  .ta:focus{border-color:var(--accent);}
  .qtypes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;}
  .faq{border-top:1px solid var(--hair);padding:14px 0;}
  .faq:first-of-type{border-top:0;}
  .faq .q{font-size:13.5px;font-weight:700;display:flex;gap:8px;}
  .faq .q b{color:var(--accent);}
  .faq .a{font-size:13px;color:var(--ink-2);line-height:1.7;margin-top:7px;padding-left:19px;}
  .actlog{display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--hair);font-size:13px;}
  .actlog:first-of-type{border-top:0;}
  .actlog .ai{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-size:13px;}
  .actlog .at{flex:1;color:var(--ink-2);line-height:1.5;}
  .actlog .at b{color:var(--ink);}
  .actlog .ad{flex:none;font-size:10.5px;color:var(--ink-soft);}

  /* ===== check-in ===== */
  .btn-checkin{flex:1;border:0;background:var(--surface-3);color:var(--ink);border-radius:13px;
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .1s ease-out;}
  .btn-checkin:active{transform:scale(.97);}
  .btn-checkin.done{background:var(--accent-soft);color:var(--accent);}
  .ci-head{display:flex;gap:14px;align-items:center;padding:18px 20px 14px;}
  .ci-bottle{flex:none;width:64px;height:64px;border-radius:15px;background:var(--surface-2);
    position:relative;overflow:hidden;display:grid;place-items:center;}
  .ci-bottle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .ci-head .cn{font-size:17px;font-weight:800;letter-spacing:-.3px;}
  .ci-head .cc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .stars{display:flex;justify-content:center;gap:6px;font-size:34px;color:var(--surface-3);margin:6px 0 4px;}
  .stars span{cursor:pointer;transition:transform .1s;}
  .stars span:active{transform:scale(1.15);}
  .stars span.on{color:#E3B15C;}
  .cimsg{text-align:center;font-size:12.5px;color:var(--ink-soft);min-height:18px;margin-bottom:14px;}
  .cimood{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
  .cimood button{border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);
    border-radius:18px;padding:8px 13px;font-size:12.5px;font-weight:600;transition:.15s;}
  .cimood button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .ci-badge{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);
    border-radius:20px;padding:4px 11px;font-size:11px;font-weight:800;}
  .badges{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px;}
  .bdg{flex:1 1 calc(33% - 6px);min-width:92px;background:var(--surface);border:1px solid var(--hair);
    border-radius:14px;padding:13px 8px;text-align:center;}
  .bdg.locked{opacity:.4;}
  .bdg .be{font-size:24px;display:block;}
  .bdg .bn{font-size:11px;font-weight:700;margin-top:5px;}
  .bdg .bd{font-size:9.5px;color:var(--ink-soft);margin-top:2px;}
  .ci-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--hair);}
  .ci-row:first-of-type{border-top:0;}
  .ci-row .cim{flex:none;width:38px;height:38px;border-radius:11px;background:var(--surface-2);
    position:relative;overflow:hidden;display:grid;place-items:center;font-size:15px;}
  .ci-row .cim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .ci-row .cit{flex:1;min-width:0;}
  .ci-row .cit b{font-size:13px;font-weight:700;display:block;}
  .ci-row .cit span{font-size:11px;color:var(--ink-soft);}
  .ci-row .cis{flex:none;font-size:11.5px;color:#E3B15C;font-weight:700;}
  .ctypes{display:flex;gap:6px;flex-wrap:wrap;}
  .tchip{border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);padding:6px 11px;
    border-radius:16px;font-size:11.5px;font-weight:600;transition:.15s;}
  .tchip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .tchip.pick{margin-left:auto;}
  .tbdg{font-size:9px;font-weight:800;letter-spacing:.3px;padding:2.5px 6px;border-radius:5px;
    background:var(--surface-2);color:var(--ink-soft);}
  .tbdg.ask{background:var(--accent-soft);color:var(--accent);}
  .tbdg.rev{background:color-mix(in srgb,#E3B15C 16%,transparent);color:#E3B15C;}
  .tbdg.vot{background:color-mix(in srgb,#4b79e8 15%,transparent);color:#7fa3e8;}
  .tbdg.hot{background:var(--accent);color:#fff;}
  .pact.reco{color:var(--accent);font-weight:700;}
  .vote{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .vopt{position:relative;overflow:hidden;border:1px solid var(--hair);background:var(--surface-2);
    border-radius:11px;padding:11px 13px;display:flex;align-items:center;text-align:left;font-size:13px;font-weight:600;color:var(--ink);}
  .vopt i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);transition:width .5s cubic-bezier(.25,.8,.25,1);}
  .vopt span{position:relative;}
  .vopt b{position:relative;margin-left:auto;color:var(--accent);font-variant-numeric:tabular-nums;}
  .vopt.on{border-color:var(--accent);}
  .vtotal{font-size:10.5px;color:var(--ink-soft);text-align:right;}
  .cchip{display:inline-flex;margin-left:6px;background:var(--accent-soft);color:var(--accent);border:0;
    border-radius:7px;padding:2.5px 7px;font-size:10.5px;font-weight:700;vertical-align:1px;}
  .cattach{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:var(--accent-soft);
    border-radius:9px;padding:7px 11px;}

/* 배너 손가락 스와이프 (모바일 터치 + 마우스 드래그) */
function initBannerSwipe(){
  const wrap=$("#banners"), track=$("#bannerTrack"); if(!wrap||!track) return;
  let sx=0, dx=0, drag=false;
  const n=track.children.length;
  const snap=()=>{ track.style.transition=""; track.style.transform=`translateX(-${bannerIdx*100}%)`;
    const cnt=$("#bannerCount"); if(cnt) cnt.textContent=(bannerIdx+1)+" / "+n; };
  wrap.addEventListener("pointerdown",e=>{ drag=true; sx=e.clientX; dx=0;
    clearInterval(bannerTimer); track.style.transition="none";
    try{ wrap.setPointerCapture(e.pointerId); }catch(_){} });
  wrap.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx;
    track.style.transform=`translateX(calc(-${bannerIdx*100}% + ${dx}px))`; });
  const end=()=>{ if(!drag) return; drag=false;
    if(Math.abs(dx)>40) bannerIdx=(bannerIdx+(dx<0?1:-1)+n)%n;
    snap(); startBanner(); };
  wrap.addEventListener("pointerup",end);
  wrap.addEventListener("pointercancel",end);
  wrap.addEventListener("pointerleave",end);
}
function matchScore(d){ if(!state.profile) return d.rating; const p=state.profile; let s=0;
  ["sweet","body","crisp","aroma"].forEach(k=> s-=Math.abs((p[k]||3)-d[k])); return s+d.rating; }

/* ============ 근처 술집 (실시간 위치 + OpenStreetMap) ============ */
const near={loading:false,error:null,items:[],pos:null,filter:"전체",asked:false};
const NEAR_FILTERS=[["전체",""],["술집·바","bar"],["펍","pub"],["주류판매점","alcohol"],["식당","restaurant"]];
const KIND_KO={bar:"술집·바",pub:"펍",alcohol:"주류판매점",restaurant:"식당",nightclub:"클럽",biergarten:"비어가든",wine:"와인샵"};
function kmDist(a,b,c,d){ const R=6371,r=Math.PI/180;
  const x=(c-a)*r, y=(d-b)*r, s=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
function fmtDist(km){ return km<1?`${Math.round(km*1000)}m`:`${km.toFixed(1)}km`; }
async function loadNear(){
  if(near.loading) return;
  near.loading=true; near.error=null; renderNear();
  try{
    const pos=await new Promise((res,rej)=>{
      if(!navigator.geolocation) return rej(new Error("nogeo"));
      navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    });
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    near.pos={lat,lon};
    const R=1200;
    const q=`[out:json][timeout:25];(
      node["amenity"~"^(bar|pub|nightclub|biergarten)$"](around:${R},${lat},${lon});
      node["shop"~"^(alcohol|wine)$"](around:${R},${lat},${lon});
      node["amenity"="restaurant"]["cuisine"~"korean|izakaya|japanese"](around:${R},${lat},${lon});
    );out body 60;`;
    const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
    if(!res.ok) throw new Error("overpass "+res.status);
    const data=await res.json();
    near.items=(data.elements||[]).filter(e=>e.tags&&e.tags.name).map(e=>{
      const t=e.tags, kind=t.amenity||t.shop||"bar";
      return {id:e.id,name:t.name,kind,kindKo:KIND_KO[kind]||kind,
        addr:[t["addr:city"],t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ")||t["addr:full"]||"",
        phone:t.phone||t["contact:phone"]||"", hours:t.opening_hours||"",
        lat:e.lat,lon:e.lon,dist:kmDist(lat,lon,e.lat,e.lon)};
    }).sort((a,b)=>a.dist-b.dist);
    if(!near.items.length) near.error="empty";
  }catch(err){
    near.error=(err&&(err.code===1))?"denied":(err&&err.message==="nogeo")?"nogeo":"fail";
  }
  near.loading=false; renderNear();
}
function renderNear(){
  const el=$("#s-near"); if(!el) return;
  const list=near.filter==="전체"?near.items:near.items.filter(x=>{
    const f=NEAR_FILTERS.find(v=>v[0]===near.filter);
    return f&&(x.kind===f[1]||(f[1]==="alcohol"&&x.kind==="wine"));
  });
  const msg={denied:["위치 권한이 필요해요","브라우저 주소창의 자물쇠 → 위치 권한을 '허용'으로 바꾼 뒤 다시 시도해주세요"],
    nogeo:["위치를 쓸 수 없는 환경이에요","HTTPS 주소에서 열어주세요"],
    empty:["주변 1.2km에 등록된 곳이 없어요","OpenStreetMap에 등록된 가게만 표시돼요"],
    fail:["정보를 불러오지 못했어요","잠시 후 다시 시도해주세요"]}[near.error];
  el.innerHTML=`
    <div class="match-hd"><h2>근처 술집</h2><p>${near.pos?`내 위치 기준 1.2km · ${near.items.length}곳`:"내 주변의 술집·바·주류샵을 찾아드려요"}</p></div>
    <div class="tabs">${NEAR_FILTERS.map(([n])=>`<button class="chip ${near.filter===n?'on':''}" data-nearf="${n}">${n}</button>`).join("")}</div>
    ${!near.pos&&!near.loading&&!near.error?`<div style="padding:16px 20px"><button class="auth-btn" data-nearload>📍 내 위치로 찾기</button>
      <div class="mhint" style="text-align:center;margin-top:10px">위치 정보는 검색에만 쓰이고 저장되지 않아요</div></div>`:''}
    ${near.loading?`<div class="list">${Array.from({length:5},()=>`<div class="sk"><div class="ska shimmer"></div><div class="skb"><div class="skl shimmer"></div><div class="skl2 shimmer"></div></div></div>`).join("")}</div>`:''}
    ${msg?`<div class="empty"><b style="color:var(--ink)">${msg[0]}</b><br><span style="font-size:12px">${msg[1]}</span><br><br><button class="chip on" data-nearload>다시 시도</button></div>`:''}
    ${!near.loading&&list.length?`<div class="list">${list.map(p=>`
      <div class="card" data-nearopen="${p.id}" role="button" tabindex="0">
        <div class="bottle"><span class="mono serif">${p.kind==="alcohol"||p.kind==="wine"?"🍾":p.kind==="pub"?"🍺":p.kind==="restaurant"?"🍲":"🍸"}</span></div>
        <div class="info">
          <div class="cat">${p.kindKo}${p.hours?` · ${p.hours.slice(0,18)}`:""}</div>
          <div class="name">${p.name}</div>
          <div class="metrics"><span class="pill g-good">${fmtDist(p.dist)}</span>${p.addr?`<span class="pill">${p.addr.slice(0,20)}</span>`:''}${p.phone?`<span class="pill">☎</span>`:''}</div>
        </div>
      </div>`).join("")}</div>`:''}
    ${near.pos&&!near.loading?`<div class="foot"><div class="fwarn">데이터 © OpenStreetMap 기여자 · 실제 영업 여부는 다를 수 있어요. 음주 후 운전은 절대 금지입니다.</div></div>`:''}`;
}

function mediaHTML(list){
  if(!list||!list.length) return "";
  const one=list.length===1;
  return `<div class="pmedia${one?'':' multi'}">${list.map(m=>m.kind==="video"
    ? `<div style="position:relative"><span class="vbadge">▶ VIDEO</span><video src="${m.src}" controls playsinline preload="metadata"></video></div>`

function addMediaFiles(files){
  const arr=[...files];
  if(!arr.length) return;
  if(composerMedia.length+arr.length>MAX_MEDIA){ toast(`사진·영상은 최대 ${MAX_MEDIA}개까지예요`); return; }
  arr.forEach(f=>{
    const isVid=f.type.startsWith("video/"), isImg=f.type.startsWith("image/");
    if(!isVid&&!isImg){ toast("사진 또는 동영상만 올릴 수 있어요"); return; }
    if(f.size>MAX_MB*1024*1024){ toast(`${MAX_MB}MB 이하만 올릴 수 있어요`); return; }
    const r=new FileReader();
    r.onload=()=>{ composerMedia.push({kind:isVid?"video":"image",src:r.result}); renderComm(); };
    r.onerror=()=>toast("파일을 읽지 못했어요");
    r.readAsDataURL(f);
  });
}

/* ============ RADAR ============ */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawRadar(vals){
  const cv=$("#radar"); if(!cv) return; const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2+6,R=Math.min(W,H)/2-58;
  ctx.clearRect(0,0,W,H);
  const axes=[["단맛","sweet"],["바디","body"],["청량","crisp"],["향","aroma"],["도수","strength"]];
  const N=axes.length, step=(Math.PI*2)/N;
  const hair=cssVar("--hair-gold")||cssVar("--hair"), ink=cssVar("--ink-soft"), gold=cssVar("--gold");
  for(let ring=1; ring<=5; ring++){ ctx.beginPath();
    for(let i=0;i<=N;i++){ const a=-Math.PI/2+step*i, rr=R*ring/5, x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.strokeStyle=cssVar("--hair"); ctx.lineWidth=1.3; ctx.stroke(); }
  ctx.font="500 22px Georgia,'Malgun Gothic',serif"; ctx.fillStyle=ink; ctx.textAlign="center"; ctx.textBaseline="middle";
  axes.forEach((ax,i)=>{ const a=-Math.PI/2+step*i;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); ctx.strokeStyle=cssVar("--hair"); ctx.lineWidth=1.1; ctx.stroke();
    ctx.fillText(ax[0], cx+Math.cos(a)*(R+30), cy+Math.sin(a)*(R+28)); });
  ctx.beginPath();
  axes.forEach((ax,i)=>{ const v=Math.max(.4,Math.min(5,vals[ax[1]]||0)), a=-Math.PI/2+step*i, rr=R*v/5, x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.closePath(); ctx.fillStyle=gold+"33"; ctx.fill(); ctx.strokeStyle=gold; ctx.lineWidth=2.4; ctx.stroke();
  axes.forEach((ax,i)=>{ const v=Math.max(.4,Math.min(5,vals[ax[1]]||0)), a=-Math.PI/2+step*i, rr=R*v/5;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,4.2,0,7); ctx.fillStyle=gold; ctx.fill(); });
}

async function loadWorld(reset){
  if(reset){ world.page=1; world.items=[]; world.done=false; world.error=false; }
  if(world.loading||world.done) return;
  world.loading=true; renderWorld();
  try{
    const res=await fetch(offURL());
    if(!res.ok) throw new Error(res.status);
    const data=await res.json();
    const raw=data.products||[];
    const prods=raw.filter(p=>p.product_name||p.product_name_ko);
    const seen=new Set(world.items.map(x=>x.code));
    world.items=world.items.concat(prods.filter(p=>p.code&&!seen.has(p.code)));
    if(raw.length<100) world.done=true;
    world.page++;
  }catch(e){ world.error=true; }
  world.loading=false; renderWorld();
}

    ${world.error?`<div class="empty">실시간 데이터를 불러오지 못했어요.<br><span style="font-size:12px;line-height:1.7">공유 링크(claude.ai)에선 보안정책상 외부 연동이 차단돼요.<br>IDE에서 이 파일을 <b>브라우저로 직접 열면</b> 전세계 술이 로드됩니다.</span></div>`:''}
    <div class="list">${world.items.map(worldCard).join("")}</div>
    ${(world.loading||(empty&&!world.error))?`<div class="list" style="margin-top:${empty?0:12}px">${Array.from({length:empty?6:2},()=>`<div class="sk"><div class="ska shimmer"></div><div class="skb"><div class="skl shimmer"></div><div class="skl2 shimmer"></div></div></div>`).join("")}</div>`:(world.done&&!empty)?`<div class="empty" style="font-size:12px">더 이상 없어요 · ${world.items.length}종</div>`:''}`;
  if(!world.started){ world.started=true; fillWorld(300); }
}
async function fillWorld(target){
  await loadWorld(true);
  let guard=0;
  while(!world.done && !world.error && world.items.length<target && guard<60){ guard++; await loadWorld(false); }
}
function openWorldSheet(p){
  if(!p) return;
  const img=p.image_front_url||p.image_front_small_url||p.image_front_thumb_url;
  const name=p.product_name_ko||p.product_name||'이름 없음';
  const brand=(p.brands||'').split(',')[0].trim();
  const country=(p.countries||'').split(',').map(s=>s.trim()).filter(Boolean).slice(-1)[0]||'';
  const alc=offAbv(p), g=additiveGrade(p);
  const ing=p.ingredients_text_ko||p.ingredients_text||'';
  const adds=(p.additives_tags||[]).map(prettyAdd);
  const gc=g.k==='good'?'good':g.k==='warn'?'warn':g.k==='bad'?'bad':'ink-soft';
  $("#sheet").innerHTML=`
    <div class="grab"></div>
    <div class="d-hero">
      <div class="d-bottle">${img?`<img src="${img}" alt="" onerror="this.remove()">`:''}<span class="mono serif">${name.trim()[0]}</span></div>
      <div class="d-title"><div class="cat">${brand||'—'}${country?' · '+country:''}</div>
        <div class="name serif">${name}</div>
        <div class="d-rating"><span class="cnt">Open Food Facts · ${p.code}</span></div></div>
    </div>
    <div class="d-meta">
      <div class="m"><b>${alc?alc+'%':'—'}</b><span>도수</span></div>
      <div class="m"><b>${p.quantity||'—'}</b><span>용량</span></div>
      <div class="m"><b style="color:var(--${gc})">${g.label}</b><span>첨가물</span></div>
    </div>
    <div class="block"><h4>원재료</h4><p class="desc">${ing||'원재료 정보가 아직 등록되지 않았어요.'}</p></div>
    ${adds.length?`<div class="block"><h4>첨가물 ${adds.length}종</h4><div class="pairs">${adds.map(a=>`<div class="pair">${a}</div>`).join("")}</div></div>`:''}
    <div class="block" style="margin-bottom:24px"><p class="desc" style="font-size:12px;color:var(--ink-soft)">Open Food Facts 오픈 데이터 · 사용자 기여로 채워져 일부 항목이 비어 있을 수 있어요.</p></div>`;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop=0;
}
document.addEventListener("click",e=>{
  const wc=e.target.closest("[data-wcat]"); if(wc){ world.cat=wc.dataset.wcat; world.q=''; $("#q").value=''; fillWorld(300); return; }
  const wo=e.target.closest("[data-wopen]"); if(wo){ openWorldSheet(world.items.find(p=>p.code==wo.dataset.wopen)); }
});
window.addEventListener("scroll",()=>{ if(state.tab!=="world"||world.loading||world.done)return;
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-700) loadWorld(false); });

/* ============ 대기업 UX: 배너·벨·인기검색어·부가 ============ */
let bannerIdx=0, bannerTimer=null;
function startBanner(){
  clearInterval(bannerTimer);
  const track=$("#bannerTrack"); if(!track) return;
  const n=track.children.length;
  bannerTimer=setInterval(()=>{
    const t=$("#bannerTrack"); if(!t){ clearInterval(bannerTimer); return; }
    bannerIdx=(bannerIdx+1)%n;
    t.style.transform=`translateX(-${bannerIdx*100}%)`;
    const dots=$("#bannerDots"); if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle("on",i===bannerIdx));
    const cnt=$("#bannerCount"); if(cnt) cnt.textContent=(bannerIdx+1)+" / "+n;
  },3000);
}
document.addEventListener("click",e=>{
  const tr=e.target.closest("[data-trend]");
  if(tr){ state.q=tr.dataset.trend; state.tab="home"; $("#q").value=state.q; renderTab(); return; }
  if(e.target.closest("[data-soon]")){ toast("서비스 준비 중이에요"); return; }
});
$("#bell").addEventListener("click",()=>toast("새 알림 1개 · 첫 리뷰 이벤트가 곧 마감돼요"));
$("#acct").addEventListener("click",()=>{ if(me){ state.tab="my"; renderTab(); } else openAuth("login"); });

document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.getAttribute&&e.target.getAttribute("role")==="button"){ e.preventDefault(); e.target.click(); }});

/* ===== 터치 폴백: 합성 click이 누락되는 환경(에뮬레이터 등)에서도 탭 보장 ===== */
(function(){
  let lastClick=0, lastX=0, lastY=0, downX=0, downY=0;
  document.addEventListener("click",()=>{ lastClick=Date.now(); },true);
  document.addEventListener("pointerdown",e=>{ downX=e.clientX; downY=e.clientY; },true);
  document.addEventListener("pointerup",e=>{
    if(e.pointerType==="mouse") return;
    if(Math.hypot(e.clientX-downX,e.clientY-downY)>12) return; /* 드래그/스크롤은 무시 */
    const t=e.target.closest("button, [role='button'], .splash, [data-open], [data-save], [data-like], [data-cmt], [data-goto], [data-cat], [data-pref], [data-retest], [data-trend], [data-soon], [data-wcat], [data-wopen], [data-drinkname]");
    if(!t) return;
    const at=Date.now();
    setTimeout(()=>{ if(lastClick<at){ try{ t.click(); }catch(_){} } },260);
  },true);
})();

/* ============ 스플래시 → 성인인증 → 온보딩 ============ */
let booted=false;
function showGate(){ if(booted) return; booted=true;
  $("#splash").classList.add("hide"); $("#gate").classList.remove("hide"); }

  $("#splash").addEventListener("click",showGate);
}

$("#gateNo").addEventListener("click",()=>{

});

renderTab(); bootFlow();
