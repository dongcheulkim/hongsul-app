<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홍술 — 술을 해석하다</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="술의 성분·숙취지수·맛 프로파일을 해석하고, 취향에 맞는 술을 추천받고, 같이 마실 사람과 근처 술집을 찾는 주류 커뮤니티 홍술">
<meta name="theme-color" content="#110D11">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="홍술">
<meta property="og:title" content="홍술 — 술을 해석하다">
<meta property="og:description" content="성분·숙취·취향으로 해석하는 술 큐레이션과 술 커뮤니티">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    /* HONGSUL DS — black & pink, dark only */
    --accent:#FF4F87; --accent-2:#E23370; --accent-soft:#2C1A22; --accent-tint:rgba(255,79,135,.12);
    --page:#0A0709; --ground:#110D11; --surface:#1A1419; --surface-2:#241C22; --surface-3:#2F262C;
    --ink:#F4EDF1; --ink-2:#C4B7BE; --ink-soft:#8F818A; --hair:#2A2128; --hair-gold:rgba(255,79,135,.28); --tile:#F3EEF0;
    --good:#4CC98A; --warn:#E3B15C; --bad:#F07178; --gold:#E3B15C;
    --sh:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -20px rgba(0,0,0,.75);
    --r-s:10px; --r-m:16px; --r-l:22px; --nav-h:64px; --side-w:236px; --gut:20px;
  }
  @media (max-width:380px){ :root{--gut:16px;} }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--page);}
  body{background:var(--page);color:var(--ink);font-size:14px;line-height:1.5;
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
  [hidden]{display:none!important;}
  button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;border:0;background:none;padding:0;font-size:inherit;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;}
  img{max-width:100%;}
  svg.i{width:1em;height:1em;display:inline-block;vertical-align:-.16em;flex:none;}
  .errbar{position:fixed;top:0;left:0;right:0;z-index:9999;background:#c1121f;color:#fff;font-size:11px;padding:8px 12px;font-family:monospace;word-break:break-all;}

  .shell{min-height:100vh;min-height:100dvh;}
  .app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--ground);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}

  /* ===== top bar ===== */
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 92%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) var(--gut) 10px;}
  .tb-row{display:flex;align-items:center;gap:8px;min-height:36px;flex-wrap:wrap;}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--accent);display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .logo svg{width:24px;height:24px;display:block;}
  .lg{stroke:var(--ink);} .lq{fill:var(--accent);} .lq2{stroke:var(--accent);}
  .tb-title{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .tb-actions{margin-left:auto;display:flex;gap:2px;}
  .icobtn{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2);border-radius:50%;position:relative;}
  .icobtn svg{width:19px;height:19px;}
  .icobtn:active{background:var(--surface-2);}
  .icobtn .bdg{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--ground);}
  .search{flex:1 1 100%;order:10;margin-top:6px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border-radius:12px;padding:10px 14px;}
  .search input{border:0;background:transparent;color:var(--ink);font-size:16px;width:100%;outline:none;min-width:0;}
  .search input::placeholder{color:var(--ink-soft);}
  .search>svg{width:17px;height:17px;color:var(--ink-soft);flex:none;}
  .search .clr{display:none;width:22px;height:22px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);place-items:center;flex:none;}
  .search .clr svg{width:11px;height:11px;}
  .search.has .clr{display:grid;}
  .topbar.nosearch .search{display:none;}

  /* ===== screens ===== */
  .screen{display:none;position:relative;padding-bottom:calc(var(--nav-h) + 28px);animation:fade .2s ease;}
  .screen.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .eyebrow{font-size:10.5px;letter-spacing:1.8px;color:var(--accent);font-weight:700;}
  .sec-h{display:flex;align-items:center;justify-content:space-between;padding:26px var(--gut) 12px;gap:10px;}
  .sec-h h2{margin:0;font-size:17.5px;font-weight:800;letter-spacing:-.3px;}
  .sec-h .more{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
  .sec-h .more svg{width:13px;height:13px;}
  .page-h{padding:22px var(--gut) 6px;}
  .page-h h2{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.4px;}
  .page-h p{margin:0;font-size:13px;color:var(--ink-soft);}

  /* ===== segmented ===== */
  .seg{display:flex;gap:4px;margin:14px var(--gut) 0;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:4px;}
  .seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-soft);transition:.15s;white-space:nowrap;}
  .seg button.on{background:var(--ink);color:var(--ground);}

  /* ===== hero ===== */
  .hero{margin:18px var(--gut) 0;border-radius:var(--r-l);padding:24px 22px;position:relative;overflow:hidden;box-shadow:var(--sh);
    background:linear-gradient(135deg,#2C1A22 0%,#1A1017 55%,#151015 100%);border:1px solid var(--hair-gold);display:flex;align-items:center;gap:16px;}
  .hero .htxt{flex:1;min-width:0;}
  .hero .himg{flex:none;width:108px;height:136px;border-radius:16px;background:var(--tile);display:grid;place-items:center;overflow:hidden;box-shadow:0 14px 30px -14px rgba(0,0,0,.8);}
  .hero .himg img{width:100%;height:100%;object-fit:contain;display:block;}
  .hero .himg .mono{color:#7A6C74;font-size:28px;}
  .hero .eyebrow{color:#FF9DBF;position:relative;}
  .hero h1{margin:8px 0 4px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.5px;text-wrap:balance;position:relative;color:#fff;}
  .hero .hp{margin:0;font-size:12.5px;color:rgba(255,255,255,.78);position:relative;}
  .hero .cta{margin-top:18px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1B171C;
    padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;position:relative;transition:transform .1s ease-out;}
  .hero .cta:active{transform:scale(.96);}

  /* ===== category rail ===== */
  .rail{display:flex;gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px var(--gut) 6px;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .catcard{flex:none;width:64px;text-align:center;}
  .catcard .ic{width:58px;height:58px;margin:0 auto 7px;border-radius:50%;display:block;transition:transform .12s ease-out;}
  .catcard:active .ic{transform:scale(.92);}
  .catcard .icp{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
    background-color:var(--surface-2);background-size:78%;background-repeat:no-repeat;background-position:center;border:1px solid var(--hair-gold);overflow:hidden;}
  .catcard .icp[style]{background-color:var(--tile);}
  .catcard .icp .mono{font-size:17px;}
  .catcard .nm{font-size:11.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;}
  .catcard.on .icp{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
  .catcard.on .nm{color:var(--ink);}

  /* ===== banners ===== */
  .banners{position:relative;margin:12px var(--gut) 0;border-radius:18px;overflow:hidden;box-shadow:var(--sh);
    touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;}
  .banners:active{cursor:grabbing;}
  .banner-track{display:flex;transition:transform .5s cubic-bezier(.25,.8,.25,1);will-change:transform;}
  .banner{flex:none;width:100%;color:#fff;position:relative;overflow:hidden;min-height:196px;text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 20px 20px 22px;}
  .banner .btxt{flex:1;min-width:0;padding-top:16px;}
  .banner .bt,.banner .bs{display:block;}
  .banner .bt{font-size:20px;font-weight:800;margin:5px 0 4px;line-height:1.3;letter-spacing:-.4px;text-wrap:balance;}
  .banner .bs{font-size:12px;color:rgba(255,255,255,.7);}
  .banner .bimg{flex:none;width:112px;height:140px;border-radius:16px;background:var(--tile);display:grid;place-items:center;overflow:hidden;box-shadow:0 14px 30px -14px rgba(0,0,0,.8);}
  .banner .bimg img{width:100%;height:100%;object-fit:contain;display:block;}
  .banner .bimg .mono{color:#7A6C74;font-size:28px;}
  .ad-tag2{position:absolute;top:12px;left:12px;font-size:9px;font-weight:800;letter-spacing:.6px;
    color:#fff;background:rgba(8,4,8,.45);backdrop-filter:blur(4px);padding:3px 7px;border-radius:5px;}
  .banner-count{position:absolute;right:12px;bottom:12px;background:rgba(8,4,8,.5);color:#fff;
    font-size:10px;padding:3px 9px;border-radius:10px;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  @media (max-width:380px){ .banner{min-height:180px;} .banner .bt{font-size:18px;} .banner .bimg{width:96px;height:120px;} }

  /* ===== reco / quick cards ===== */
  .reco-card{display:flex;align-items:center;gap:12px;margin:14px var(--gut) 0;width:calc(100% - var(--gut)*2);
    background:var(--accent-soft);border-radius:var(--r-m);padding:16px 18px;text-align:left;transition:transform .1s ease-out;}
  .reco-card:active{transform:scale(.985);}
  .reco-card .reco-txt{flex:1;min-width:0;}
  .reco-card .eyebrow,.reco-card .rt,.reco-card .rs{display:block;}
  .reco-card .rt{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.35;margin:5px 0 3px;white-space:pre-line;letter-spacing:-.2px;}
  .reco-card .rs{font-size:11.5px;color:var(--ink-soft);}
  .reco-card .reco-go{flex:none;background:var(--accent);color:#fff;border-radius:11px;padding:9px 14px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
  .quick{display:flex;align-items:center;gap:13px;margin:12px var(--gut) 0;width:calc(100% - var(--gut)*2);background:var(--surface);
    border:1px solid var(--hair);border-radius:var(--r-m);padding:14px 16px;text-align:left;transition:transform .1s ease-out;}
  .quick:active{transform:scale(.985);}
  .quick .qi{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);}
  .quick .qi svg{width:22px;height:22px;}
  .quick .qt{flex:1;min-width:0;}
  .quick .qt b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.2px;}
  .quick .qt span{font-size:12px;color:var(--ink-soft);}
  .quick .qa{color:var(--ink-soft);}
  .quick .qa svg{width:16px;height:16px;}

  /* ===== shelves ===== */
  .shelf{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px var(--gut) 10px;scrollbar-width:none;}
  .shelf::-webkit-scrollbar{display:none;}
  .ptile{flex:none;width:116px;text-align:left;transition:transform .1s ease-out;}
  .ptile:active{transform:scale(.96);}
  .pimg{position:relative;width:116px;height:116px;border-radius:14px;overflow:hidden;background:var(--tile);display:grid;place-items:center;}
  .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .pimg .mono{color:#7A6C74;}
  .pimg .mono{font-size:24px;}
  .pimg:has(img) .mono{display:none;}
  .prank{position:absolute;left:0;top:0;min-width:24px;height:24px;padding:0 6px;z-index:1;background:#1B151A;
    color:#fff;font-weight:800;display:grid;place-items:center;font-size:12px;border-radius:14px 0 10px 0;font-variant-numeric:tabular-nums;}
  .pname{font-size:12.5px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);}
  .pprice{font-size:13.5px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
  .pstar{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

  /* ===== list cards ===== */
  .list{padding:4px var(--gut) 4px;display:flex;flex-direction:column;gap:10px;}
  .list .card{animation:fade .25s cubic-bezier(.2,.7,.2,1) both;}
  .list .card:nth-child(1){animation-delay:.02s}.list .card:nth-child(2){animation-delay:.05s}
  .list .card:nth-child(3){animation-delay:.08s}.list .card:nth-child(4){animation-delay:.11s}
  .list .card:nth-child(n+5){animation-delay:.13s}
  .card{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--hair);
    border-radius:var(--r-m);padding:13px 14px;transition:transform .09s ease-out;text-align:left;width:100%;
    content-visibility:auto;contain-intrinsic-size:auto 96px;cursor:pointer;}
  .card:active{transform:scale(.985);}
  .rank{flex:none;width:22px;text-align:center;font-size:16px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .rank.top{color:var(--gold);font-weight:800;}
  .bottle{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);position:relative;overflow:hidden;}
  .bottle:has(img){background:var(--tile);}
  .bottle img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .bottle svg{width:22px;height:22px;color:var(--ink-soft);}
  .mono{font-size:20px;font-weight:700;color:var(--ink-soft);}
  .bottle:has(img) .mono{display:none;}
  .info{flex:1;min-width:0;}
  .info .cat{font-size:10.5px;color:var(--ink-soft);letter-spacing:.2px;}
  .info .name{font-size:15px;font-weight:700;margin:2px 0 0;letter-spacing:-.2px;}
  .crow{display:flex;align-items:baseline;gap:7px;margin:3px 0 7px;flex-wrap:wrap;}
  .crow b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
  .crow span{font-size:11px;color:var(--ink-soft);}
  .star{color:var(--gold);}
  .metrics{display:flex;gap:5px;flex-wrap:wrap;}
  .pill{font-size:10.5px;padding:3.5px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600;}
  .pill.g-good{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good);}
  .pill.g-warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn);}
  .pill.g-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);}
  .bdg-best{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.6px;color:var(--gold);
    background:rgba(227,177,92,.14);border-radius:4px;padding:2px 5px;margin-right:5px;vertical-align:2px;}
  .savebtn{align-self:center;margin-left:auto;color:var(--ink-soft);padding:6px;transition:.15s;display:grid;place-items:center;}
  .savebtn svg{width:20px;height:20px;}
  .savebtn.on{color:var(--accent);}
  .savebtn.on svg{fill:currentColor;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:48px 20px;line-height:1.7;}
  .empty b{color:var(--ink);}

  /* ===== chips ===== */
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:14px var(--gut) 6px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs.wrap{flex-wrap:wrap;}
  .chip{flex:none;border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);
    padding:8px 14px;border-radius:20px;font-size:12.5px;white-space:nowrap;transition:.15s;font-weight:600;display:inline-flex;align-items:center;gap:5px;}
  .chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink);}
  .chip.sm{padding:6px 11px;font-size:11.5px;}
  .chip.sort{background:transparent;border-color:transparent;color:var(--ink-soft);padding:5px 10px;font-size:11.5px;}
  .chip.sort.on{background:var(--surface-3);color:var(--ink);border-color:transparent;}
  .sortlbl{flex:none;font-size:11px;color:var(--ink-soft);padding:6px 2px 6px 0;font-weight:700;letter-spacing:.3px;}
  .chip svg{width:13px;height:13px;}

  /* ===== match ===== */
  .radar-wrap{padding:8px var(--gut) 4px;}
  .radar-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-l);padding:16px 12px;box-shadow:var(--sh);}
  .radar-card canvas{width:100%;height:auto;display:block;max-width:420px;margin:0 auto;}
  .prefs{display:flex;gap:8px;flex-wrap:wrap;padding:10px var(--gut) 4px;}
  .pref{border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);padding:9px 14px;border-radius:20px;font-size:12.5px;transition:.15s;font-weight:600;}
  .pref.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;}

  /* ===== collections ===== */
  .colls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px var(--gut) 0;}
  .coll{border-radius:16px;padding:16px 15px;text-align:left;min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;
    position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.05);transition:transform .1s;}
  .coll:active{transform:scale(.97);}
  .coll .k{font-size:9.5px;letter-spacing:1.4px;font-weight:800;color:rgba(255,255,255,.55);}
  .coll .t{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.3;}
  .coll .n{font-size:11px;color:rgba(255,255,255,.55);}
  .coll.on{box-shadow:inset 0 0 0 2px var(--accent);}
  .coll>svg{position:absolute;right:12px;top:12px;width:20px;height:20px;color:rgba(255,255,255,.4);}

  /* ===== avatar ===== */
  .av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;flex:none;
    background:color-mix(in srgb,var(--avc,var(--accent)) 22%,var(--surface-2));color:var(--avc,var(--accent));font-weight:800;font-size:14px;}
  .av.lg{width:56px;height:56px;font-size:22px;}
  .av.sm{width:28px;height:28px;font-size:12px;}
  .avatars{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .avatars button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;background:var(--c);opacity:.8;transition:.15s;}
  .avatars button.on{border-color:#fff;opacity:1;box-shadow:0 0 0 2px var(--c);}

  /* ===== profile ===== */
  .profile-card{margin:16px var(--gut) 4px;border-radius:var(--r-l);padding:22px;color:var(--ink);
    background:linear-gradient(135deg,#2A1A22,#171216);border:1px solid var(--hair-gold);box-shadow:var(--sh);position:relative;overflow:hidden;}
  .profile-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,135,.22),transparent 70%);pointer-events:none;}
  .profile-card .prow{display:flex;align-items:center;gap:14px;}
  .profile-card .av{background:var(--accent-tint);color:var(--accent);}
  .profile-card .k{font-size:10px;letter-spacing:1.8px;color:var(--accent);font-weight:700;}
  .profile-card h3{margin:4px 0 2px;font-size:22px;font-weight:800;letter-spacing:-.3px;}

  .pklist{display:flex;flex-direction:column;gap:7px;padding:0 var(--gut) 30px;}
  .pkitem{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;text-align:left;color:var(--ink);}
  .pkitem .pkc{font-size:10px;color:var(--ink-soft);background:var(--surface-2);border-radius:5px;padding:2px 6px;flex:none;}
  .pkitem b{margin-left:auto;color:var(--gold);font-size:11px;font-weight:700;white-space:nowrap;}
  .mini-post{display:flex;align-items:center;gap:9px;margin:0 var(--gut) 8px;background:var(--surface);border:1px solid var(--hair);border-radius:13px;padding:11px 13px;text-align:left;width:calc(100% - var(--gut)*2);}
  .mini-post .mtxt{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-post .mtxt b{color:var(--ink);}
  .mini-post .mlk{flex:none;font-size:11px;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:3px;}
  .mini-post .mlk svg{width:12px;height:12px;fill:currentColor;}

  /* ===== meetups ===== */
  .meets{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px var(--gut) 10px;scrollbar-width:none;}
  .meets::-webkit-scrollbar{display:none;}
  .meets.grid{flex-wrap:wrap;overflow:visible;}
  .meet{flex:none;width:224px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:15px;text-align:left;transition:transform .1s ease-out;}
  .meet:active{transform:scale(.975);}
  .meet .mtop{display:flex;align-items:center;gap:6px;margin-bottom:9px;}
  .mkind{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:3px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);}
  .mkind.flash{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);}
  .mkind.party{background:color-mix(in srgb,#7f6ce8 20%,transparent);color:#9d8cf0;}
  .mkind.class{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);}
  .meet .mdist{margin-left:auto;font-size:10.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .meet .mtitle2{font-size:14.5px;font-weight:800;line-height:1.35;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px;}
  .meet .mwhen{font-size:11.5px;color:var(--ink-2);margin-top:7px;}
  .meet .mfoot{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:10px;border-top:1px solid var(--hair);}
  .meet .mppl{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .meet .mbar{flex:1;height:4px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
  .meet .mbar i{display:block;height:100%;background:var(--accent);border-radius:3px;}
  .meet .mfee{font-size:11px;font-weight:700;color:var(--ink);}
  .meet.full{opacity:.55;}
  .mnew{flex:none;width:132px;border:1.5px dashed var(--hair-gold);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--accent);font-size:12.5px;font-weight:700;min-height:150px;}
  .mnew svg{width:22px;height:22px;}
  .mchips{display:flex;gap:7px;overflow-x:auto;padding:2px var(--gut) 8px;scrollbar-width:none;}
  .mchips::-webkit-scrollbar{display:none;}
  .mhost{display:flex;align-items:center;gap:9px;padding:14px var(--gut) 6px;}
  .mhost b{font-size:13.5px;}
  .mhost span{font-size:11px;color:var(--ink-soft);display:block;}
  .mdetail-row{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--hair);font-size:13.5px;}
  .mdetail-row:first-of-type{border-top:0;padding-top:0;}
  .mdetail-row .mk{flex:none;width:62px;color:var(--ink-soft);font-size:12.5px;}
  .mdetail-row .mv{flex:1;color:var(--ink);}
  .joined{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:4px 10px;font-size:10.5px;font-weight:800;}

  /* ===== near ===== */
  .near-cta{padding:14px var(--gut) 0;}
  .auth-btn{width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:16px;font-size:15px;font-weight:700;margin-top:8px;transition:transform .1s ease-out;display:flex;align-items:center;justify-content:center;gap:7px;}
  .auth-btn svg{width:17px;height:17px;}
  .auth-btn:active{transform:scale(.98);background:var(--accent-2);}
  .auth-btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--hair);}
  .auth-btn.danger{background:var(--bad);}

  /* ===== auth ===== */
  .auth{position:fixed;inset:0;z-index:80;display:flex;}
  .auth.hide{display:none;}
  .auth-panel{width:100%;max-width:440px;margin:0 auto;background:var(--ground);display:flex;flex-direction:column;overflow:hidden;}
  .auth-top{display:flex;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 22px 4px;}
  .auth-top .ttl{font-size:15px;font-weight:800;}
  .auth-x{margin-left:auto;}
  .auth-body{flex:1;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:8px 24px calc(28px + env(safe-area-inset-bottom));}
  .auth-body h2{margin:14px 0 6px;font-size:25px;font-weight:800;letter-spacing:-.5px;}
  .auth-body .asub{color:var(--ink-soft);font-size:13.5px;margin-bottom:24px;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .field input{width:100%;border:1.5px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:13px;padding:14px 15px;font-size:16px;outline:none;transition:.15s;}
  .field input:focus{border-color:var(--accent);}
  .field .err{font-size:11px;color:var(--bad);margin-top:5px;display:none;}
  .field.bad input{border-color:var(--bad);} .field.bad .err{display:block;}
  .auth-alt{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:18px;}
  .auth-alt b{color:var(--accent);font-weight:700;cursor:pointer;}
  .auth-div{display:flex;align-items:center;gap:10px;margin:20px 0 14px;color:var(--ink-soft);font-size:11px;}
  .auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:var(--hair);}
  .soc{display:flex;flex-direction:column;gap:9px;}
  .soc button{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:13px;padding:13px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;}
  .soc .kakao{background:#FEE500;color:#191600;border-color:transparent;}

  /* ===== nav ===== */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;height:var(--nav-h);
    background:color-mix(in srgb,var(--ground) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--hair);display:flex;z-index:35;padding-bottom:env(safe-area-inset-bottom);}
  .nav .nlogo,.nav .nfoot{display:none;}
  .nav button{flex:1;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:9.5px;letter-spacing:-.2px;padding-top:4px;transition:color .15s;position:relative;}
  .nav button.on{color:var(--ink);font-weight:700;}
  .nav button.on svg{color:var(--accent);}
  .nav svg{width:21px;height:21px;}
  @media (max-width:380px){ .nav svg{width:19px;height:19px;} .nav button{font-size:9px;} }

  /* ===== onboarding ===== */
  .onb{position:fixed;inset:0;z-index:60;display:flex;}
  .onb.hide{display:none;}
  .onb-panel{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--ground);position:relative;}
  .onb-top{padding:24px 24px 0;}
  .onb-prog{height:3px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .onb-prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
  .onb-skip{position:absolute;top:22px;right:22px;color:var(--ink-soft);font-size:12.5px;}
  .onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;}
  .onb-body .eyebrow{margin-bottom:12px;}
  .onb-body h2{margin:0 0 8px;font-size:25px;line-height:1.3;font-weight:800;letter-spacing:-.4px;text-wrap:balance;}
  .onb-body .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:26px;}
  .onb-opts{display:flex;flex-direction:column;gap:10px;}
  .onb-opt{border:1.5px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:14px;padding:16px 18px;font-size:15px;font-weight:600;text-align:left;display:flex;align-items:center;gap:13px;transition:.15s;}
  .onb-opt.on{border-color:var(--accent);background:var(--accent-soft);}
  .onb-foot{padding:18px 24px calc(24px + env(safe-area-inset-bottom));}
  .onb-next{width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:16px;font-size:15px;font-weight:700;transition:transform .1s ease-out,opacity .15s;}
  .onb-next:active:not(:disabled){transform:scale(.98);background:var(--accent-2);}
  .onb-next:disabled{opacity:.35;cursor:default;}

  /* ===== gate / splash / toast ===== */
  .gate{position:fixed;inset:0;z-index:90;background:rgba(12,8,12,.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:26px;}
  .gate.hide{display:none;}
  .gate-card{background:var(--ground);border:1px solid var(--hair);border-radius:20px;padding:28px 24px;width:100%;max-width:380px;text-align:center;box-shadow:var(--sh);}
  .gate-card .g19{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:19px;font-weight:800;margin:0 auto 14px;}
  .gate-card h3{margin:0 0 6px;font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .gate-card p{margin:0 0 20px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .gate-card .g-no{width:100%;color:var(--ink-soft);border-radius:13px;padding:12px;font-size:13.5px;}
  .splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--ground);transition:opacity .4s ease;}
  .splash.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s;}
  .splash .smark svg{width:58px;height:58px;display:block;margin-bottom:2px;animation:sfade .7s ease;}
  .splash .slogo{font-size:42px;font-weight:800;letter-spacing:-1px;color:var(--accent);animation:sfade .8s ease;}
  .splash .stag{font-size:11px;letter-spacing:3.5px;color:var(--ink-soft);font-weight:600;animation:sfade 1.1s ease;}
  .splash .sbar{width:110px;height:2.5px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:12px;}
  .splash .sbar i{display:block;height:100%;width:40%;background:var(--accent);animation:sload 1.1s ease infinite;}
  @keyframes sfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes sload{0%{transform:translateX(-120%);}100%{transform:translateX(320%);}}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:70;
    background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
    opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--sh);max-width:calc(100% - 40px);text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ===== skeleton ===== */
  .sk{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-m);padding:13px 14px;}
  .sk .ska{width:56px;height:56px;border-radius:14px;flex:none;}
  .sk .skb{flex:1;display:flex;flex-direction:column;gap:8px;}
  .sk .skl{height:10px;border-radius:6px;width:38%;}
  .sk .skl2{height:14px;border-radius:6px;width:68%;}
  .shimmer{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite;}
  @keyframes shim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* ===== footer ===== */
  .foot{margin:28px var(--gut) 8px;padding:18px 0 8px;border-top:1px solid var(--hair);color:var(--ink-soft);font-size:11px;line-height:1.8;}
  .foot .fwarn{margin-top:10px;padding:9px 12px;background:var(--surface-2);border-radius:10px;font-size:10px;}

  /* ===== small screens ===== */
  @media (max-width:380px){
    .hero{padding:20px 18px;} .hero h1{font-size:23px;}
    .splash .slogo{font-size:34px;}
    .onb-top,.onb-body,.onb-foot{padding-left:18px;padding-right:18px;}
    .onb-body h2{font-size:22px;} .onb-opt{padding:14px 15px;font-size:14px;}
    .d-title .name{font-size:19px;} .d-bottle{width:70px;height:70px;}
    .catcard{width:58px;} .catcard .ic{width:52px;height:52px;}
    .ptile,.pimg{width:106px;} .pimg{height:106px;}
    .seg button{font-size:12px;padding:8px 4px;}
  }
  @media (max-width:330px){ .hero h1{font-size:21px;} .logo{font-size:19px;} .bottle{width:50px;height:50px;} }
  @media (min-width:441px) and (max-width:959px){ .app{border-left:1px solid var(--hair);border-right:1px solid var(--hair);} }
  @media (max-height:600px){ .onb-body h2{font-size:20px;} .onb-body .sub{margin-bottom:14px;} .onb-opts{gap:8px;} .onb-opt{padding:12px 14px;} }
  @media (prefers-reduced-motion: reduce){ .shimmer,.splash .sbar i{animation:none;} .screen,.list .card{animation:none;} }

  /* ===== right rail (wide desktop) ===== */
  .aside{display:none;}
  @media (min-width:1380px){
    .shell{display:flex;justify-content:center;align-items:flex-start;}
    .app{margin:0;flex:0 1 800px;width:100%;}
    .aside{display:block;flex:none;width:312px;position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:22px 22px 40px;scrollbar-width:none;}
    .aside::-webkit-scrollbar{display:none;}
    .aside h3{margin:22px 0 10px;font-size:13px;font-weight:800;letter-spacing:-.2px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;}
    .aside h3:first-child{margin-top:8px;}
    .aside h3 .more{font-size:11.5px;color:var(--ink-soft);font-weight:600;display:inline-flex;align-items:center;gap:2px;}
    .aside h3 .more svg{width:12px;height:12px;}
    .aside .tabs{padding:0;flex-wrap:wrap;}
    .aside .mini-post{margin:0 0 8px;width:100%;}
    .aside .arow{display:flex;gap:10px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:13px;padding:11px 12px;margin-bottom:8px;text-align:left;}
    .aside .arow .mkind{flex:none;}
    .aside .arow .at{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .aside .arow .at span{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;}
    .aside .quick{margin:0;width:100%;}
    .aside .afoot{margin-top:22px;font-size:10.5px;color:var(--ink-soft);line-height:1.7;}
  }

  /* ===== desktop / wide web layout ===== */
  @media (min-width:960px){
    .shell{padding-left:var(--side-w);}
    .app{max-width:800px;border-left:1px solid var(--hair);border-right:1px solid var(--hair);}
    .nav{left:0;top:0;bottom:0;transform:none;width:var(--side-w);max-width:none;height:auto;flex-direction:column;
      border-top:0;border-right:1px solid var(--hair);padding:22px 14px 18px;gap:4px;background:var(--page);}
    .nav .nlogo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;color:var(--accent);padding:6px 12px 22px;letter-spacing:-.5px;}
    .nav .nlogo svg{width:26px;height:26px;}
    .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0;transition:.15s;}
    .nav button:hover{background:var(--surface);}
    .nav button.on{background:var(--surface);color:var(--ink);}
    .nav svg{width:20px;height:20px;}
    .nav .nfoot{display:block;margin-top:auto;padding:12px;font-size:11px;color:var(--ink-soft);line-height:1.7;}
    .screen{padding-bottom:64px;}
    .topbar{padding-top:16px;padding-bottom:12px;}
    .topbar .logo{display:none!important;}
    .topbar .tb-title{display:block!important;}
    .topbar .search,.topbar.nosearch .search{display:flex;order:0;flex:1 1 auto;margin:0 0 0 14px;max-width:440px;padding:8px 14px;}
    .topbar .tb-row{gap:10px;}
    .list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .list .empty{grid-column:1/-1;}
    .list .card{content-visibility:visible;}
    .ptile,.pimg{width:140px;} .pimg{height:140px;}
    .catcard{width:74px;} .catcard .ic{width:64px;height:64px;}
    .banner{min-height:250px;padding:26px 30px;} .banner .bt{font-size:25px;} .banner .bimg{width:160px;height:196px;}
    .hero{padding:32px 30px;} .hero h1{font-size:32px;} .hero .himg{width:150px;height:184px;}
    .colls{grid-template-columns:repeat(4,1fr);}
    .meet{width:250px;}
    .sheet{left:50%;top:50%;bottom:auto;max-width:620px;max-height:88vh;border-radius:22px;border:1px solid var(--hair);
      transform:translate(-50%,-46%);opacity:0;transition:transform .22s cubic-bezier(.22,.9,.3,1),opacity .2s,visibility 0s .25s;}
    .sheet.open{transform:translate(-50%,-50%);opacity:1;transition-delay:0s;}
    .sheet .grab{display:none;}
    .sheet .sheet-x{display:grid;}
    .d-actions{padding-bottom:22px;}
    .toast{left:calc(50% + var(--side-w)/2);bottom:36px;}
    .auth{background:rgba(6,3,5,.72);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px;}
    .auth-panel{max-width:460px;max-height:92vh;border-radius:22px;border:1px solid var(--hair);box-shadow:var(--sh);}
    .auth-top{padding-top:20px;}
    .onb{background:rgba(6,3,5,.72);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px;}
    .onb-panel{max-width:520px;min-height:540px;height:auto;border-radius:22px;border:1px solid var(--hair);box-shadow:var(--sh);}
    .onb-body{padding:24px 32px;}
    .onb-top{padding:26px 32px 0;}
    .onb-foot{padding:18px 32px 28px;}
  }
</style>

<body>
<div class="shell">
<div class="app">
  <div class="topbar" id="topbar">
    <div class="tb-row">
      <div class="logo" id="tbLogo"><svg viewBox="0 0 24 24" fill="none">
        <path class="lg" d="M10.7 1.9h2.6" stroke-width="1.7" stroke-linecap="round"/>
        <path class="lg" d="M7 4.7h10" stroke-width="1.7" stroke-linecap="round"/>
        <circle class="lg" cx="12" cy="10.4" r="4.9" stroke-width="1.7"/>
        <path class="lq" d="M7.7 11c1.6-.85 3-.35 4.4.1 1.4.45 2.9.35 4.3-.3a4.9 4.9 0 0 1-8.7.2z"/>
        <path class="lq2" d="M14.1 9.2 18.5 3.4" stroke-width="1.5" stroke-linecap="round"/>
        <path class="lg" d="M12 15.3v4.3M8.8 21.5h6.4" stroke-width="1.7" stroke-linecap="round"/>
      </svg>홍술</div>
      <div class="tb-title" id="tbTitle" hidden>홈</div>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="술 이름·종류 검색" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="qClear" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="tb-actions">
        <button class="icobtn" id="bell" aria-label="알림">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="bdg"></span>
        </button>
        <button class="icobtn" id="acct" aria-label="계정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        </button>
      </div>
    </div>

function setBad(id,bad){ const el=$(id); if(el) el.classList.toggle("bad",bad); return !bad; }
function doAuth(){
  const signup=authMode==="signup";
  const email=($("#a-email").value||"").trim().toLowerCase(), pw=$("#a-pw").value||"";
  let ok=true;
  ok=setBad("#f-email",!/^\S+@\S+\.\S+$/.test(email))&&ok;
  ok=setBad("#f-pw",pw.length<6)&&ok;
  let nick="";
  if(signup){ nick=($("#a-nick").value||"").trim(); ok=setBad("#f-nick",nick.length<2)&&ok; }
  if(!ok) return;
  const users=DB.users();
  if(signup){
    if(users.some(u=>u.email===email)){ setBad("#f-email",true); $("#f-email .err").textContent="이미 가입된 이메일이에요"; return; }
    users.push({email,nick,av:authAvatar,pw:hash(pw),joined:Date.now()}); DB.saveUsers(users);
    me={email,nick,av:authAvatar}; DB.setSession(me); closeAuth(); afterAuth(); toast(`환영해요, ${nick}님`);
  }else{
    const u=users.find(x=>x.email===email);
    if(!u||u.pw!==hash(pw)){ setBad("#f-pw",true); $("#f-pw .err").textContent="이메일 또는 비밀번호가 맞지 않아요"; return; }
    me={email:u.email,nick:u.nick,av:u.av}; DB.setSession(me); closeAuth(); afterAuth(); toast(`${u.nick}님, 반가워요`);
  }
}

function startBanner(){
  clearInterval(bannerTimer);
  const track=$("#bannerTrack"); if(!track) return;
  const n=track.children.length;
  bannerTimer=setInterval(()=>{
    const t=$("#bannerTrack"); if(!t||document.hidden){ if(!t) clearInterval(bannerTimer); return; }
    bannerIdx=(bannerIdx+1)%n; t.style.transform=`translateX(-${bannerIdx*100}%)`;
    const cnt=$("#bannerCount"); if(cnt) cnt.textContent=(bannerIdx+1)+" / "+n;
  },3800);
}
function initBannerSwipe(){
  const wrap=$("#banners"), track=$("#bannerTrack"); if(!wrap||!track) return;
  let sx=0, dx=0, drag=false, moved=false;
  const n=track.children.length;
  bannerIdx=Math.min(bannerIdx,n-1);
  track.style.transition="none"; track.style.transform=`translateX(-${bannerIdx*100}%)`; requestAnimationFrame(()=>track.style.transition="");
  const cnt=$("#bannerCount"); if(cnt) cnt.textContent=(bannerIdx+1)+" / "+n;
  const snap=()=>{ track.style.transition=""; track.style.transform=`translateX(-${bannerIdx*100}%)`; const c=$("#bannerCount"); if(c) c.textContent=(bannerIdx+1)+" / "+n; };
  wrap.addEventListener("pointerdown",e=>{ drag=true; moved=false; sx=e.clientX; dx=0; clearInterval(bannerTimer); track.style.transition="none"; try{ wrap.setPointerCapture(e.pointerId); }catch(_){} });
  wrap.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true; track.style.transform=`translateX(calc(-${bannerIdx*100}% + ${dx}px))`; });
  const end=()=>{ if(!drag) return; drag=false; if(Math.abs(dx)>40) bannerIdx=(bannerIdx+(dx<0?1:-1)+n)%n; snap(); startBanner(); };
  wrap.addEventListener("pointerup",end); wrap.addEventListener("pointercancel",end); wrap.addEventListener("pointerleave",end);
  wrap.addEventListener("click",e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
}

/* ============ RADAR ============ */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawRadar(vals){
  const cv=$("#radar"); if(!cv) return; const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2+6,R=Math.min(W,H)/2-58;
  ctx.clearRect(0,0,W,H);
  const axes=[["단맛","sweet"],["바디","body"],["청량","crisp"],["향","aroma"],["도수","strength"]];
  const N=axes.length, step=(Math.PI*2)/N;
  const ink=cssVar("--ink-soft"), gold=cssVar("--accent"), hair=cssVar("--hair");
  for(let ring=1; ring<=5; ring++){ ctx.beginPath();
    for(let i=0;i<=N;i++){ const a=-Math.PI/2+step*i, rr=R*ring/5, x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.strokeStyle=hair; ctx.lineWidth=1.3; ctx.stroke(); }
  ctx.font="600 22px 'Pretendard Variable',Pretendard,system-ui,sans-serif"; ctx.fillStyle=ink; ctx.textAlign="center"; ctx.textBaseline="middle";
  axes.forEach((ax,i)=>{ const a=-Math.PI/2+step*i;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); ctx.strokeStyle=hair; ctx.lineWidth=1.1; ctx.stroke();
    ctx.fillText(ax[0], cx+Math.cos(a)*(R+30), cy+Math.sin(a)*(R+28)); });
  ctx.beginPath();
  axes.forEach((ax,i)=>{ const v=Math.max(.4,Math.min(5,vals[ax[1]]||0)), a=-Math.PI/2+step*i, rr=R*v/5, x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.closePath(); ctx.fillStyle=gold+"33"; ctx.fill(); ctx.strokeStyle=gold; ctx.lineWidth=2.4; ctx.stroke();
  axes.forEach((ax,i)=>{ const v=Math.max(.4,Math.min(5,vals[ax[1]]||0)), a=-Math.PI/2+step*i, rr=R*v/5;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,4.2,0,7); ctx.fillStyle=gold; ctx.fill(); });
}

/* ============ 근처 술집 (위치 + OpenStreetMap) ============ */
const near={loading:false,error:null,items:[],pos:null,filter:"전체",placeName:null};
const SPOTS=[["강남",37.4979,127.0276],["홍대",37.5563,126.9236],["이태원",37.5345,126.9946],["종로",37.5704,126.9921],["성수",37.5445,127.0560],["건대",37.5403,127.0700],["서면",35.1579,129.0594],["해운대",35.1587,129.1604]];
let nearView="meet";
const NEAR_FILTERS=[["전체",""],["술집·바","bar"],["펍","pub"],["주류판매점","alcohol"]];
const KIND_KO={bar:"술집·바",pub:"펍",alcohol:"주류판매점",restaurant:"식당",nightclub:"클럽",biergarten:"비어가든",wine:"와인샵"};
const KIND_ICON={bar:"glass",pub:"beer",alcohol:"bottle",wine:"wine",nightclub:"moon",biergarten:"beer",restaurant:"cup"};
function kmDist(a,b,c,d){ const R=6371,r=Math.PI/180; const x=(c-a)*r, y=(d-b)*r, s=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2; return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
function fmtDist(km){ return km<1?`${Math.round(km*1000)}m`:`${km.toFixed(1)}km`; }
const OVERPASS=["https://overpass.private.coffee/api/interpreter","https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
function getPos(){ return new Promise((res,rej)=>{ if(!navigator.geolocation||!window.isSecureContext) return rej({code:"nogeo"});
  navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:120000}); }); }
async function overpass(q){
  let last=null;
  for(const url of OVERPASS){
    try{ const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),20000);
      const res=await fetch(url,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
      clearTimeout(to);
      if(res.status===429||res.status===504){ last="busy"; continue; }
      if(!res.ok){ last="fail"; continue; }
      return await res.json();
    }catch(_){ last="fail"; }
  }
  throw {code:last||"fail"};
}
async function loadNear(manual){
  if(near.loading) return;
  near.loading=true; near.error=null; renderNear();
  try{
    let lat,lon;
    if(manual){ lat=manual.lat; lon=manual.lon; near.placeName=manual.name; }
    else{ const pos=await getPos(); lat=pos.coords.latitude; lon=pos.coords.longitude; near.placeName=null; }
    near.pos={lat,lon};
    const R=1500;
    const q=`[out:json][timeout:20];(node["amenity"~"^(bar|pub|nightclub|biergarten)$"](around:${R},${lat},${lon});way["amenity"~"^(bar|pub)$"](around:${R},${lat},${lon});node["shop"~"^(alcohol|wine)$"](around:${R},${lat},${lon}););out center 80;`;
    const data=await overpass(q);
    near.items=(data.elements||[]).filter(e=>e.tags&&e.tags.name).map(e=>{
      const t=e.tags, kind=t.amenity||t.shop||"bar";
      const la=e.lat!=null?e.lat:(e.center&&e.center.lat), lo=e.lon!=null?e.lon:(e.center&&e.center.lon);
      if(la==null||lo==null) return null;
      return {id:e.id,name:t.name,kind,kindKo:KIND_KO[kind]||kind,
        addr:[t["addr:city"],t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ")||t["addr:full"]||"",
        phone:t.phone||t["contact:phone"]||"", hours:t.opening_hours||"", lat:la,lon:lo,dist:kmDist(lat,lon,la,lo)};
    }).filter(Boolean).sort((a,b)=>a.dist-b.dist);
    if(!near.items.length) near.error="empty";
  }catch(err){
    const c=err&&err.code;
    near.error = c===1?"denied" : c===3?"timeout" : c==="nogeo"?"nogeo" : c==="busy"?"busy" : c===2?"unavail" : "fail";
    if(near.error!=="empty") near.pos=null;
  }
  near.loading=false; renderNear();
}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-nearload]")){ loadNear(); return; }

  const nf=e.target.closest("[data-nearf]"); if(nf){ near.filter=nf.dataset.nearf; renderNear(); return; }
  const ns=e.target.closest("[data-nearspot]"); if(ns){ const s=SPOTS.find(x=>x[0]===ns.dataset.nearspot); if(s) loadNear({name:s[0],lat:s[1],lon:s[2]}); return; }

  if(no){ const p=near.items.find(x=>String(x.id)===no.dataset.nearopen); if(!p) return;

      설정:settings, 내보낸시각:new Date().toISOString()};
    try{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="hongsul-my-data.json"; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast("내 데이터를 내려받았어요");
    }catch(_){ toast("내려받기에 실패했어요"); } return; }
  if(t.closest("[data-clearsaved]")){ if(!state.saved.size){ toast("찜한 술이 없어요"); return; }

    const msg=$("#rateMsg"); if(msg) msg.textContent=["","아쉬웠어요","조금 아쉬워요","괜찮아요","좋아요","최고예요"][rateVal]; return; }
  if(t.closest("[data-sendrate]")){ if(!rateVal){ toast("별점을 선택해주세요"); return; } closeSheet(); toast(`${rateVal}점 평가 감사합니다`); rateVal=0; return; }
  if(t.closest("[data-confirmdelete]")){ const users=DB.users().filter(x=>x.email!==me.email); DB.saveUsers(users);
    try{ localStorage.removeItem(DB.key()); }catch(_){}

    closeSheet(); state.tab="home"; renderTab(); toast("탈퇴가 완료되었어요. 언제든 다시 만나요"); return; }
});

  CHECKINS.unshift({id:Date.now(),drink:d.name,cat:d.cat,rate:ciRate,mood:ciMood,text:txt,photo:ciPhoto,at:Date.now()}); saveCheckins();
  const after=BADGES.filter(b=>b.t(CHECKINS));
  COMM.unshift({id:Date.now()+1,type:"checkin",chan:"리뷰",who:me.nick,av:me.av,uid:me.email,at:Date.now(),
    text:`${"★".repeat(ciRate)}${"☆".repeat(5-ciRate)} ${d.name}${ciMood?` · ${ciMood}`:""}${txt?`\n${txt}`:""}`,
    drink:d.name, media:ciPhoto?[{kind:"image",src:ciPhoto}]:null, likes:0, liked:false, cmts:[]});
  savePosts(); closeSheet();
  const newB=after.length>before?after[after.length-1]:null;
  toast(newB?`체크인 완료. "${newB.n}" 뱃지 획득`:`체크인 완료 · ${"★".repeat(ciRate)}`);
  commSort="new"; commCh="전체"; state.tab="comm"; renderTab(); window.scrollTo(0,0);
}
document.addEventListener("input",e=>{ if(e.target&&e.target.id==="ciText") ciText=e.target.value; });
document.addEventListener("click",e=>{
  const t=e.target;
  const ck=t.closest("[data-checkin]"); if(ck){ const d=byId(+ck.dataset.checkin); if(d){ if(!requireLogin("체크인하려면 로그인이 필요해요")) return; openCheckin(d); } return; }
  const cr=t.closest("[data-cirate]"); if(cr){ ciRate=+cr.dataset.cirate; paintCheckin(); return; }
  const cmo=t.closest("[data-cimood]"); if(cmo){ ciMood=ciMood===cmo.dataset.cimood?null:cmo.dataset.cimood; paintCheckin(); return; }
  if(t.closest("[data-cipick]")){ const f=$("#ciFile"); if(f) f.click(); return; }
  if(t.closest("[data-cidelphoto]")){ ciPhoto=null; paintCheckin(); return; }
  if(t.closest("[data-cisubmit]")){ doCheckin(); return; }
  const sh=t.closest("[data-share]"); if(sh){ const d=byId(sh.dataset.share); if(d) shareText(d.name,`[홍술] ${d.name} · ${d.cat} ${d.abv}%\n★ ${d.rating.toFixed(1)} · ${won(d.price)} · ${gradeText[d.addGrade]} · 숙취 ${HANG5[d.hangover]}\n${location.origin}${location.pathname}`,"술 정보를 복사했어요"); return; }
});
document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="ciFile"&&e.target.files[0]){
    const f=e.target.files[0];
    if(f.size>MAX_MB*1024*1024){ toast(`${MAX_MB}MB 이하만 올릴 수 있어요`); return; }
    const r=new FileReader(); r.onload=()=>{ ciPhoto=r.result; paintCheckin(); }; r.readAsDataURL(f); e.target.value="";
  }
});

/* ============ DISPATCH ============ */
const TITLES={home:"홈",explore:"탐색",comm:"수다방",near:"근처",my:"마이"};
function renderTab(){
  ["home","explore","comm","near","my"].forEach(t=>{ const el=$("#s-"+t); if(el) el.classList.toggle("on",state.tab===t); });
  $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
  $("#topbar").classList.toggle("nosearch",!(state.tab==="home"||state.tab==="explore"));
  $("#tbTitle").textContent=TITLES[state.tab]||"홍술"; $("#tbTitle").hidden=state.tab==="home"; $("#tbLogo").hidden=state.tab!=="home";
  ({home:renderHome,explore:renderExplore,comm:renderComm,near:renderNear,my:renderMy})[state.tab]();
  renderAside();
}
function go(tab){ state.tab=tab; renderTab(); window.scrollTo(0,0); }

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-closesheet]")){ closeSheet(); return; }
  const save=t.closest("[data-save]"); if(save){ e.stopPropagation(); toggleSave(save.dataset.save); return; }
  const saveClose=t.closest("[data-save-close]"); if(saveClose){ toggleSave(saveClose.dataset.saveClose); return; }
  const open=t.closest("[data-open]"); if(open){ openSheet(byId(open.dataset.open)); return; }
  const ex=t.closest("[data-explore]");
  if(ex){ state.explore=ex.dataset.explore; if(ex.dataset.cat){ state.cat=ex.dataset.cat; } if(ex.dataset.sort){ state.sort=ex.dataset.sort; }
    if(state.tab!=="explore") go("explore"); else { renderExplore(); window.scrollTo(0,0); } return; }
  const coll=t.closest("[data-coll]");
  if(coll){ state.coll=+coll.dataset.coll; state.explore="coll"; if(state.tab!=="explore") go("explore"); else renderExplore(); return; }
  const cat=t.closest("[data-cat]"); if(cat){ state.cat=cat.dataset.cat; renderExplore(); return; }
  const so=t.closest("[data-sort]"); if(so){ state.sort=so.dataset.sort; renderExplore(); return; }
  const pref=t.closest("[data-pref]"); if(pref){ const k=pref.dataset.pref; state.prefs.has(k)?state.prefs.delete(k):state.prefs.add(k); DB.saveData(); renderExplore(); return; }
  if(t.closest("[data-prefclear]")){ state.prefs=new Set(); DB.saveData(); renderExplore(); return; }
  const gt=t.closest("[data-goto]"); if(gt){ go(gt.dataset.goto); return; }
  if(t.closest("[data-retest]")){ startOnb(); return; }
  const tr=t.closest("[data-trend]"); if(tr){ state.q=tr.dataset.trend; $("#q").value=state.q; $("#searchBox").classList.add("has"); go("home"); return; }
});
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return;
  if(state.tab===b.dataset.tab){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  state.q=""; $("#q").value=""; $("#searchBox").classList.remove("has"); go(b.dataset.tab); });
$("#scrim").addEventListener("click",closeSheet);
$("#q").addEventListener("input",e=>{ const v=e.target.value; $("#searchBox").classList.toggle("has",!!v.trim());
  clearTimeout(window._ht); window._ht=setTimeout(()=>{ state.q=v.trim(); if(state.q&&state.tab!=="home") state.tab="home"; renderTab(); },120); });
$("#qClear").addEventListener("click",()=>{ $("#q").value=""; state.q=""; $("#searchBox").classList.remove("has"); renderTab(); $("#q").focus(); });
$("#bell").addEventListener("click",()=>openMy("noti"));
$("#acct").addEventListener("click",()=>{ if(me) go("my"); else openAuth("login"); });
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.getAttribute&&e.target.getAttribute("role")==="button"){ e.preventDefault(); e.target.click(); }
  if(e.key==="Escape"){ if($("#sheet").classList.contains("open")) closeSheet(); else if(!$("#auth").classList.contains("hide")) closeAuth(); }
});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&state.tab==="home") startBanner(); });

/* ============ ONBOARDING (취향 진단) ============ */
const QUIZ=[
  { q:"어떤 맛을 가장 좋아하세요?", opts:[["달콤한 맛","sweet"],["깔끔·드라이","dry"],["진하고 묵직한","body"],["상큼·청량한","crisp"]] },
  { q:"선호하는 도수는?", opts:[["가볍게 (~6도)","soft"],["적당히 (15~25도)","mid"],["독하게 (35도+)","hard"]] },
  { q:"술을 마실 때 가장 중요한 건?", opts:[["다음날 컨디션","clean"],["깨끗한 성분","cleanadd"],["풍부한 향","aroma"],["가성비","cheap"]] },
];
const PROFILES={
  sweet:{name:"스위트 러버",desc:"달콤한 술로 하루를 마무리하는 당신",p:{sweet:5,body:2,crisp:3,aroma:3}},
  dry:{name:"클린 드라이",desc:"군더더기 없는 깔끔함을 즐기는 미니멀리스트",p:{sweet:1,body:3,crisp:4,aroma:3}},
  body:{name:"딥 보디드",desc:"진하고 묵직한 한 잔의 깊이를 아는 애주가",p:{sweet:2,body:5,crisp:2,aroma:5}},
  crisp:{name:"프레시 청량파",desc:"톡 쏘는 청량감이 최고인 당신",p:{sweet:2,body:2,crisp:5,aroma:2}},
};
let quizStep=0, quizAns=[];
function startOnb(){ quizStep=0; quizAns=[]; $("#onb").classList.remove("hide"); paintQuiz(); }
function paintQuiz(){ const s=QUIZ[quizStep];
  $("#onbBar").style.width=((quizStep+1)/QUIZ.length*100)+"%";
  $("#onbBody").innerHTML=`<div class="eyebrow">취향 진단 · ${quizStep+1} / ${QUIZ.length}</div>
    <h2>${s.q}</h2><div class="sub">가장 가까운 걸 골라주세요</div>
    <div class="onb-opts">${s.opts.map(([l,k])=>`<button class="onb-opt ${quizAns[quizStep]===k?'on':''}" data-opt="${k}">${l}</button>`).join("")}</div>`;
  $("#onbNext").disabled=!quizAns[quizStep]; $("#onbNext").textContent=quizStep===QUIZ.length-1?"결과 보기":"다음"; }
$("#onbBody").addEventListener("click",e=>{ const o=e.target.closest("[data-opt]"); if(!o) return;
  quizAns[quizStep]=o.dataset.opt; $$(".onb-opt").forEach(x=>x.classList.toggle("on",x===o)); $("#onbNext").disabled=false; });
$("#onbNext").addEventListener("click",()=>{ if(quizStep<QUIZ.length-1){ quizStep++; paintQuiz(); } else finishOnb(); });
$("#onbSkip").addEventListener("click",()=>{ $("#onb").classList.add("hide"); });
function finishOnb(){ const first=quizAns[0]||"crisp";
  state.profile = PROFILES[first]?{...PROFILES[first].p, name:PROFILES[first].name, desc:PROFILES[first].desc}:{sweet:3,body:3,crisp:3,aroma:3,name:"밸런스형",desc:"두루 즐기는 균형잡힌 취향"};
  state.prefs=new Set(); if(["sweet","dry","body","crisp"].includes(first)) state.prefs.add(first);
  if(quizAns[1]==="soft") state.prefs.add("soft");
  if(quizAns[2]==="clean") state.prefs.add("clean"); if(quizAns[2]==="cleanadd") state.prefs.add("cleanadd"); if(quizAns[2]==="aroma") state.prefs.add("aroma");
  DB.saveData(); $("#onb").classList.add("hide"); go("home"); toast(`취향 진단 완료 · ${state.profile.name}`); }

/* ===== 터치 폴백: 합성 click이 누락되는 환경에서도 탭 보장 ===== */
(function(){
  let lastClick=0, downX=0, downY=0;
  document.addEventListener("click",()=>{ lastClick=Date.now(); },true);
  document.addEventListener("pointerdown",e=>{ downX=e.clientX; downY=e.clientY; },true);
  document.addEventListener("pointerup",e=>{
    if(e.pointerType==="mouse") return;
    if(Math.hypot(e.clientX-downX,e.clientY-downY)>12) return;
    const t=e.target.closest("button, [role='button'], .splash");
    if(!t) return; const at=Date.now();
    setTimeout(()=>{ if(lastClick<at){ try{ t.click(); }catch(_){} } },260);
  },true);
})();

/* ============ 스플래시 → 성인인증 ============ */
let booted=false;
function showGate(){ if(booted) return; booted=true;
  $("#splash").classList.add("hide");
  if(settings.adult&&lsGet("hs_adult",false)) return;
  $("#gate").classList.remove("hide"); }
function bootFlow(){ setTimeout(showGate,650); $("#splash").addEventListener("click",showGate); }
$("#gateYes").addEventListener("click",()=>{ $("#gate").classList.add("hide"); if(settings.adult) lsSet("hs_adult",true); });
$("#gateNo").addEventListener("click",()=>{
  $("#gate .gate-card").innerHTML=`<div class="g19">19</div><h3>이용이 제한돼요</h3><p>홍술은 만 19세 이상만 이용할 수 있는<br>주류 정보 서비스입니다.<br><br>성인이 된 후 다시 만나요.</p>`;
});

/* ============ INIT ============ */
renderTab(); bootFlow();
</script>
